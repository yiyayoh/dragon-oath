<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>醉龙酒馆：龙誓</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* Layout: BG3-style dialogue screen. Party rail on the left, a portrait stage above the story scroll, choices below. One deliberate night-tavern look: smoked oak, brass trim, silver for the dragon oath. */
:root {
  color-scheme: dark;
  --oak: #17110d;
  --oak-2: #221912;
  --oak-3: #33261b;
  --line: #4a3726;
  --ink: #efe3cb;
  --muted: #a48f74;
  --brass: #d4ab5c;
  --ember: #e48a3f;
  --silver: #c9d6e3;
  --wine: #b3434f;
  --moss: #86ab70;
  --f-display: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  --f-body: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% -20%, rgba(228,138,63,.16), transparent 60%), var(--oak);
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.75;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
.btn {
  background: var(--oak-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; color: var(--ink);
}
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn.gold {
  background: linear-gradient(#e2bb6c, #b48638); color: #23170b; border-color: #87652a;
  font-weight: 600; padding: 9px 20px; box-shadow: 0 2px 0 #573f1d;
}
.btn.small { padding: 3px 10px; font-size: 13px; }
.label { font-size: 12px; letter-spacing: .16em; color: var(--muted); }
h1, h2, h3 { text-wrap: balance; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.top h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 4.5vw, 40px); line-height: 1; color: var(--brass); text-shadow: 0 0 16px rgba(228,138,63,.3); }
.top .where { color: var(--muted); font-size: 13px; }
.top .sp { flex: 1; }
.top .menu { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- creation ---------- */
.create { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.panel { background: var(--oak-2); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 16px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--ink); line-height: 1.2; }
.step { display: grid; gap: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.field { display: grid; gap: 4px; flex: 1; min-width: 160px; }
.field input, .field textarea, .field select {
  background: var(--oak); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%;
}
.field textarea { resize: vertical; min-height: 64px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.chip {
  text-align: left; background: var(--oak); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  display: grid; gap: 2px; align-content: start;
}
.chip b { font-weight: 600; }
.chip small { color: var(--muted); font-size: 12px; line-height: 1.5; }
.chip[aria-pressed="true"] { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.pb { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pb-cell { background: var(--oak); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; }
.pb-top { display: flex; justify-content: space-between; align-items: baseline; }
.pb-top b { font-weight: 600; }
.pb-val { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.pb-val .n { font-size: 22px; font-weight: 600; min-width: 2ch; text-align: center; }
.pb-val .m { color: var(--brass); font-size: 13px; }
.pb-val .r { color: var(--muted); font-size: 12px; }
.pb-val button { width: 28px; height: 28px; border-radius: 50%; padding: 0; background: var(--oak-2); border: 1px solid var(--line); }
.pb-bonus { display: flex; gap: 4px; }
.pb-bonus .btn { padding: 0 8px; font-size: 12px; color: var(--muted); }
.pb-bonus .btn[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
.points { font-variant-numeric: tabular-nums; }
.points b { color: var(--brass); }
.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.portrait-pick { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; }
.portrait-pick img { width: 96px; aspect-ratio: 2/3; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); max-width: 100%; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; font-size: 14px; }
.kv b { font-weight: 600; }
.skills-list { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; background: var(--oak); }
.warn { color: var(--ember); font-size: 13px; }

/* ---------- play ---------- */
.play { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px; align-items: start; }
.rail { display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.pc {
  display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; text-align: left;
  background: var(--oak-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%;
}
.pc img { width: 44px; height: 56px; object-fit: cover; border-radius: 4px; }
.pc .nm { font-weight: 600; font-size: 14px; line-height: 1.3; }
.pc .sub { font-size: 11.5px; color: var(--muted); line-height: 1.4; font-variant-numeric: tabular-nums; }
.pc.away { opacity: .55; }
.hpbar { height: 5px; background: #0d0806; border-radius: 3px; overflow: hidden; margin-top: 3px; }
.hpbar i { display: block; height: 100%; background: linear-gradient(90deg, #7d2a33, var(--wine)); transition: width .4s; }
.rail .note { font-size: 12px; color: var(--muted); padding: 2px 4px; }

.main { display: grid; gap: 12px; min-width: 0; }
.stage {
  position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
  height: 300px; background: var(--scene, linear-gradient(160deg, #3b2614, #120c08));
  transition: background .8s;
}
.stage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,6,4,.85) 0%, rgba(10,6,4,.2) 55%, transparent); pointer-events: none; }
.stage .scene-name { position: absolute; left: 18px; top: 16px; z-index: 2; max-width: 55%; }
.stage .scene-name .t { font-family: var(--f-display); font-size: 30px; line-height: 1.1; color: var(--ink); }
.stage .scene-name .l { font-size: 13px; color: var(--muted); margin-top: 4px; }
.stage .speaker { position: absolute; right: 16px; bottom: 0; height: 290px; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.stage .speaker img { height: 254px; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px 8px 0 0; box-shadow: 0 0 40px rgba(0,0,0,.6); max-width: 100%; }
.stage .speaker .plate {
  background: linear-gradient(#2a1d14, #1a120d); border: 1px solid var(--brass); border-radius: 4px; padding: 1px 14px;
  font-weight: 600; font-size: 14px; margin-top: -14px; position: relative; white-space: nowrap;
}
.stage .others { position: absolute; left: 18px; bottom: 14px; z-index: 2; display: flex; gap: 8px; }
.stage .others img { width: 52px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.stage .mark-glow { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(circle at 70% 40%, rgba(201,214,227,.55), transparent 55%); animation: flash 1.6s ease-out forwards; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }

.story {
  background: linear-gradient(rgba(255,255,255,.015), transparent), var(--oak-2);
  border: 1px solid var(--line); border-radius: 10px; padding: 16px clamp(14px, 3vw, 26px);
  height: min(46vh, 520px); min-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
}
.e { max-width: 70ch; white-space: pre-wrap; overflow-wrap: anywhere; }
.e.gm { font-size: 15.5px; line-height: 1.95; }
.e.you { align-self: flex-end; text-align: right; color: var(--brass); font-style: italic; }
.e.roll { align-self: center; font-size: 13px; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 99px; padding: 1px 14px; background: var(--oak); }
.e.roll.ok { color: var(--moss); border-color: rgba(134,171,112,.5); }
.e.roll.bad { color: #e48b94; border-color: rgba(179,67,79,.55); }
.e.sys { align-self: center; font-size: 12.5px; color: var(--muted); }
.e.sys.appr-up { color: var(--moss); }
.e.sys.appr-down { color: #e48b94; }
.e.chapter { align-self: center; font-family: var(--f-display); font-size: 24px; color: var(--brass); padding-top: 6px; }
.e.live:empty::before { content: "说书人正在构思……"; color: var(--muted); font-style: italic; }
.e.live::after { content: "▍"; color: var(--brass); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.opts { display: grid; gap: 6px; }
.opt {
  text-align: left; background: linear-gradient(var(--oak-3), var(--oak-2)); border: 1px solid #5b4430; border-radius: 8px;
  padding: 9px 12px; display: flex; gap: 10px; align-items: baseline; color: var(--ink);
}
.opt:hover:not(:disabled) { border-color: var(--brass); }
.opt .k { flex: none; color: var(--brass); font-weight: 900; font-variant-numeric: tabular-nums; }
.opt .tx { flex: 1; min-width: 0; }
.opt .ck { flex: none; font-size: 12px; color: var(--brass); }
.free { display: flex; gap: 8px; }
.free textarea {
  flex: 1; min-width: 0; resize: none; height: 48px; background: var(--oak-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
.free textarea::placeholder { color: var(--muted); }
.status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.status .sp { flex: 1; }

/* toasts */
.toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; transform: translateX(-50%); z-index: 40; display: grid; gap: 6px; justify-items: center; pointer-events: none; }
.toast { background: rgba(23,17,13,.94); border: 1px solid var(--line); border-radius: 99px; padding: 4px 16px; font-size: 14px; animation: toast 2.6s ease forwards; }
.toast.up { color: var(--moss); border-color: rgba(134,171,112,.5); }
.toast.down { color: #e48b94; border-color: rgba(179,67,79,.5); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }

/* modal */
.modal {
  position: fixed; inset: 0; z-index: 30; background: rgba(8,5,3,.8); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet {
  background: var(--oak-2); border: 1px solid #5b4430; border-radius: 12px; width: min(760px, 100%); max-height: 100%; overflow-y: auto;
  padding: 20px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.sheet h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; color: var(--brass); line-height: 1.2; }
.sheet .head { display: flex; align-items: center; gap: 10px; }
.sheet .head .sp { flex: 1; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button[aria-selected="true"] { border-color: var(--brass); color: var(--brass); }
.cs { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; }
.cs img { width: 150px; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); max-width: 100%; }
.abil { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.abil div { background: var(--oak); border: 1px solid var(--line); border-radius: 6px; text-align: center; padding: 4px 0; }
.abil .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.abil .s { font-size: 11px; color: var(--muted); }
.sk { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 14px; font-size: 13px; }
.sk span { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.sk .pr { color: var(--brass); }
.appr { display: grid; grid-template-columns: 70px 1fr 44px; gap: 8px; align-items: center; font-size: 13px; }
.apbar { height: 8px; background: #0d0806; border-radius: 4px; position: relative; overflow: hidden; }
.apbar i { position: absolute; top: 0; bottom: 0; }
.slot { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--oak); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.slot .meta { font-size: 12.5px; color: var(--muted); }
.recap { margin: 0; font-size: 14px; line-height: 1.85; color: var(--ink); white-space: pre-wrap; }
.mem { margin: 2px 0 0; padding-left: 1.2em; font-size: 13px; color: var(--muted); }
.mem li { margin: 1px 0; }

/* dice */
.dice-card { width: min(400px, 100%); justify-items: center; text-align: center; }
.dice-card .why { color: var(--muted); font-size: 14px; margin: 0; }
.dice-row { display: flex; gap: 14px; justify-content: center; }
.d20 {
  width: 130px; height: 130px; clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  background: linear-gradient(150deg, rgba(255,255,255,.35), transparent 40%), conic-gradient(from 30deg, #b8323e, #7d1d28, #b8323e, #8f2530, #b8323e);
  display: grid; place-items: center; font-size: 48px; font-weight: 900; color: #fbe9d0; text-shadow: 0 2px 0 #3d0d12; font-variant-numeric: tabular-nums;
}
.d20.dim { filter: grayscale(.8) brightness(.6); }
.d20.small { width: 90px; height: 90px; font-size: 34px; }
.d20.spin { animation: wob .12s linear infinite; }
@keyframes wob { 0% { transform: rotate(-8deg) scale(.96); } 50% { transform: rotate(8deg) scale(1.04); } 100% { transform: rotate(-8deg) scale(.96); } }
.math { font-variant-numeric: tabular-nums; min-height: 1.6em; }
.verdict { font-family: var(--f-display); font-size: 30px; line-height: 1; min-height: 1em; }
.verdict.ok { color: var(--moss); } .verdict.bad { color: var(--wine); }

/* combat: zone board replaces the choice list while a fight is on */
.e.cb { align-self: stretch; max-width: none; font-size: 13px; line-height: 1.7; color: #cdbb9c; font-variant-numeric: tabular-nums; border-left: 2px solid var(--line); padding-left: 10px; }
.e.cb.hit { border-left-color: #7d2a33; }
.e.cb.crit { border-left-color: var(--ember); color: var(--ink); }
.e.cb.up { border-left-color: var(--moss); }
.e.cb.down { border-left-color: var(--wine); color: #e48b94; }
.e.cb.round { border: 0; padding: 0; align-self: center; color: var(--brass); }
.e.cb.event { border-left-color: var(--ember); color: var(--ember); }
.combat { display: grid; gap: 10px; background: var(--oak-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.cb-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.cb-head .t { font-family: var(--f-display); font-size: 22px; color: var(--brass); line-height: 1.2; }
.init { display: flex; gap: 4px; flex-wrap: wrap; }
.init span { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; background: var(--oak); }
.init span.foe { color: #e48b94; }
.init span.now { border-color: var(--brass); color: var(--brass); }
.init span.gone { opacity: .35; text-decoration: line-through; }
.zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.zone { background: var(--oak); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 6px; align-content: start; min-height: 92px; }
.zone.here { border-color: var(--brass); }
.zone.fire { box-shadow: inset 0 0 22px rgba(228,138,63,.35); }
.zone .zn { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; font-weight: 600; font-size: 14px; }
.zone .zt { font-size: 11px; color: var(--muted); font-weight: 400; }
.unit { display: grid; gap: 2px; text-align: left; background: var(--oak-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; font-size: 12.5px; width: 100%; color: var(--ink); }
.unit.foe { border-color: rgba(179,67,79,.5); }
.unit.wild { border-color: #6b6648; }
.unit.now { box-shadow: inset 0 0 0 1px var(--brass); }
.unit.down { opacity: .6; }
.unit.tgt { border-color: var(--brass); background: #3a2a16; }
.unit.tgt:hover { background: #4a3519; }
.unit .ub { display: flex; justify-content: space-between; gap: 6px; font-variant-numeric: tabular-nums; }
.unit .cd { font-size: 11px; color: var(--ember); }
.zone .camp-face { width: 100%; height: 132px; object-fit: cover; object-position: 50% 15%; border-radius: 6px; }
.unit.ally .hpbar i { background: linear-gradient(90deg, #4f6e3f, var(--moss)); }
.cb-res { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; }
.cb-res .on { color: var(--moss); }
.cb-res .off { color: var(--muted); text-decoration: line-through; }
.cb-acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cb-acts .sp { flex: 1; }

.endcard { text-align: center; justify-items: center; }
.endcard p { max-width: 54ch; color: var(--muted); }

@media (max-width: 860px) {
  .create { grid-template-columns: 1fr; }
  .summary { position: static; }
  .play { grid-template-columns: 1fr; }
  .rail { position: static; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); overflow-x: auto; padding-bottom: 4px; }
  .rail .note { display: none; }
  .stage { height: 220px; }
  .stage .speaker { height: 210px; }
  .stage .speaker img { height: 180px; }
  .stage .scene-name .t { font-size: 22px; }
  .stage .others { display: none; }
  .zones { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cs { grid-template-columns: 1fr; }
  .abil { grid-template-columns: repeat(3, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .d20.spin, .e.live::after, .toast, .stage .mark-glow { animation: none; }
}
</style>

<div class="wrap">
  <header class="top">
    <h1>醉龙酒馆：龙誓</h1>
    <span class="where" id="where"></span>
    <span class="sp"></span>
    <div class="menu" id="menu" hidden>
      <button class="btn small" type="button" id="mSheet">角色</button>
      <button class="btn small" type="button" id="mJournal">日志</button>
      <button class="btn small" type="button" id="mSave">存档</button>
      <button class="btn small" type="button" id="mSettings">设置</button>
    </div>
    <button class="btn small" type="button" id="mLoad" hidden>读取存档</button>
  </header>

  <main id="createView" class="create" hidden></main>

  <main id="playView" class="play" hidden>
    <aside class="rail" id="rail" aria-label="队伍"></aside>
    <section class="main">
      <div class="stage" id="stage"></div>
      <div class="story" id="story" aria-live="polite"></div>
      <div class="opts" id="opts"></div>
      <form class="free" id="freeForm">
        <textarea id="freeText" placeholder="写下你想做的任何事，比如“我端着酒走到壁炉边，问那位精灵骑士这把剑有什么故事”"></textarea>
        <button class="btn gold" type="submit" id="freeBtn">行动</button>
      </form>
      <div class="status"><span id="statusText"></span><span class="sp"></span><button class="btn small" type="button" id="stopBtn" hidden>停止</button><button class="btn small" type="button" id="retryBtn" hidden>重试上一步</button></div>
    </section>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal" id="modal" hidden></div>

<script>
/* =========================================================
   数据
   ========================================================= */
const AB = { str: "力量", dex: "敏捷", con: "体质", int: "智力", wis: "感知", cha: "魅力" };
const AB_KEYS = Object.keys(AB);

    anchor: "鱼腥、焦油和赌徒的吆喝。黑潮会控制着这里：仓库、私船、地下斗兽场，收保护费的打手在栈桥上晃来晃去，渔妇和搬运工都不敢大声说话。码头上能去的地方（玩家说去哪里就把 advance 设为对应 id）：金鳗赌场 act1_docks_casino（老鳗·莫格在那艘改成赌场的旧船上见客）；地下斗兽场 act1_docks_arena（卡西安十年前在那里打过拳）；金鳗船底的货舱 act1_docks_hold（要先知道维克斯的债和莉丝的事才找得到）；回港口 act1_hub。码头本身：若维克斯在序幕里离开了队伍，他就躲在旧仓库里躲债，可以用 recruit 劝他回来；黑潮会的打手会上门找他（债务被提起时写 act1.debt_known=true：欠老鳗的债限期三天，不然他妹妹莉丝会被卖到外海）。最远的泊位停着老鳗的快船“黑鳗号”。在这里真打起来写 combat 为 docks_brawl；码头斗殴打过之后，若玩家要强抢黑鳗号（或再跟黑潮会动手），写 combat 为 docks_ship；赢了写 act1.ship=stolen、act1.eel=enemy。",

  act1_docks_casino: {

    anchor: "一艘改成赌场的旧船，甲板上挂满灯笼，船舱里烟雾缭绕：骰子、纸牌、斗鸡，还有一张专给“贵客”的牌桌。老鳗·莫格（笑眉笑眼、毒如蛇蝎的胖老头，脖子上盘着鳗鱼刺青，满手金戒指）坐在最里面的天鹅绒椅子上，只认利益。他可以：拿维克斯的债要挟（妹妹莉丝扣在他手里，三天期限；债务被提起时写 act1.debt_known=true）；开价——替他从总督府金库偷出总督的走私账本（总督拿它要挟黑潮会多年），他就借出“黑鳗号”并把维克斯的债减半（写 act1.eel=deal；交了账本、他答应借船时写 act1.ship=black_eel）；他也愿意直接买下维克斯那颗银“宝石”（他知道那是龙蛋）——卖给他就算清债务、放出莉丝（维克斯的个人任务抉择 sold：写 quest.vex=sold、act1.lise=saved、act1.vex_debt=paid）。玩家可以上牌桌（巧手或洞悉对抗 DC 14，每局输赢 10~30 金币，用 gold 字段；出千被抓就要动手），或者与黑潮会为敌（写 act1.eel=enemy）。维克斯在老鳗面前会变得很小心、很安静，被当众羞辱后，若他赞同 ≥ 20，事后会私下承认那颗“宝石”其实是龙蛋，黑潮会和教团都在找它，并说出莉丝被关在这艘船的船底货舱（写 quest.vex.egg=true）。动手时写 combat 为 docks_brawl。去别处时 advance：act1_docks、act1_docks_arena、act1_docks_hold 或 act1_hub。",

  act1_docks_arena: {
    title: "地下斗兽场", loc: "黑潮码头 · 地下斗兽场", bg: "linear-gradient(160deg,#5c3a2c,#22140f 60%,#0e0806)", act: 1,
    anchor: "仓库底下挖出来的圆形斗场，铁笼、沙地、看台上挤满了赌徒，空气里是汗、血和廉价朗姆酒。卡西安会认出这个地方（他是十年前的头牌“碎潮”），老赌客会认出他。亡友的儿子阿登（年轻的斗士，认定是卡西安毒死了他父亲）当众要求和他生死决斗，写 quest.kassian.arden=true。斗兽场账房的旧账本里记着当年那瓶毒药是老鳗买的（卡西安赞同 ≥ 20 才肯让你帮他查：溜进账房要隐匿或巧手 DC 14，或者买通账房先生；查到写 quest.kassian.poison=true）；之后卡西安的抉择写 quest.kassian：exposed 当众公布证据（阿登成为盟友，黑潮会颜面扫地）、spared 接受决斗但不杀阿登、killed_eel 让卡西安亲手杀死老鳗（他的誓言破碎）。斗场主管“铁颚”会招揽队伍下场打黑拳（支线），真打的时候写 combat 为 arena_bout。去别处时 advance：act1_docks、act1_docks_casino 或 act1_hub。",

  act1_docks_hold: {
    title: "金鳗的货舱", loc: "黑潮码头 · 金鳗船底", bg: "linear-gradient(160deg,#2e3a3a,#101616 60%,#060808)", act: 1, camp: false,
    anchor: "金鳗船底潮湿的货舱，走私的酒桶和香料箱堆到顶，最里面的铁栏后面关着几个“抵债”的人，莉丝（十六岁的提夫林少女，和维克斯一样的尖角，倔得要命）也在里面。两名打手看守，钥匙在老鳗手里，锁可以撬（巧手 DC 15）。若维克斯赞同 ≥ 20、还没说过龙蛋的事，他在这里会说出真相（写 quest.vex.egg=true）。莉丝一离开货舱（被救走、偷出来、被港卫军带走），同一轮就写 act1.lise=saved，不然维克斯的债到期时程序会当作她被卖了。救莉丝的方式就是维克斯个人任务的抉择，写 quest.vex：stormed 强攻救人、留下龙蛋（同时写 act1.lise=saved、act1.eel=enemy）；alone 让维克斯独自去和老鳗交易（结果由程序决定，你只写 quest.vex）；卖蛋要去赌场找老鳗。维克斯个人任务没走到抉择时，也可以直接把人偷出来（写 act1.lise=saved、act1.eel=enemy）。其他被关的人（一个欠债的渔夫、一个被抓来抵债的寡妇的儿子）也可以顺手救出来。动手时写 combat 为 docks_brawl。离开时 advance：act1_docks 或 act1_hub。",

    anchor: "港口北边半塌的学院塔楼，暴风夜第七道银光落在这里。被学院除名的法师莉拉·星烬把自己反锁在塔顶研究掌心的印记，几名教团探子（4 名狂信徒、1 名烬火术士）正在撬塔门、往里放烟。莉拉在塔顶用火焰箭和刻薄话死守。帮她赶走探子：动手时在 JSON 写 combat 为 tower_spies（莉拉会一起参战），也可以智取、吓跑。之后莉拉会审视这群“也被烙上印记的人”，嘴硬地提出交换研究，条件见同伴资料，可以用 recruit 让她加入。塔顶有她贴满墙的印记草图和一架被银光烧化的望远镜；她会提到塔底地下室放着她的研究笔记。去地下室把 advance 设为 act1_tower_vault；离开时 advance 回 act1_hub。",

  act1_wreck: {
    title: "沉船湾", loc: "灰帆港 · 沉船湾", bg: "linear-gradient(160deg,#5f7380,#212b31 60%,#0c1013)", loc1: true,

    anchor: "退潮时才露出来的礁缝和几艘半沉的旧船，海水在脚边进进出出，潮水一涨就会淹回去（拖太久要掷运动或求生）。这是赛勒涅个人任务的第一步：龙腹下的礁缝里压着一具穿晨星骑士团铠甲的遗骸（骑士团长），怀里有一本被海水泡坏的日记。找到时写 quest.selene.diary=true；日记的真相第二幕才读得懂，现在只读得出零星字句，不要说破献祭渔村的事。礁石上长着发光的“潮汐藻”（能解老鼠带来的烬毒，支线要用）。半沉的旧船里漂着鬼火，天黑后被龙死时的银光惊醒的溺死水手会从水里爬出来：动手时写 combat 为 wreck_drowned；也可以用宗教检定（DC 13）让它们安息。溺死水手里有一个手上戴着刻字的铜戒指（支线）。离开时 advance：act1_wreck 或 act1_hub。",

    anchor: "总督艾德蒙·科尔（风度翩翩、满口法度的半精灵）的府邸，白天可以访客身份进去。守誓人的钥匙（一枚刻着龙鳞纹的银钥匙）锁在地下金库，十年前从玛莎的亡夫那里没收来的；同一个金库里还有总督的走私账本（老鳗想要）。白天可以试探总督、打听金库；港卫军尉官萨丝·铁锤（正直的青铜龙裔）对印记持有者充满怀疑，但她也在暗中查总督——可以和她合作搜集“总督秘密接受教团资助”的证据（写 act1.sath_trust=true；揭发总督写 act1.key=legal、act1.governor=exposed；勒索总督写 act1.key=blackmail、act1.governor=blackmailed）。钥匙真正交到玩家手里时才写 act1.key（萨丝只是答应“会安排归还”还不算）。萨丝还在头疼一件事：港卫军的巡逻时间表总是提前泄露给教团（支线）。三天后的晚上有月光舞会，需要请柬（伪造写 act1.invite=forged、购买 bought、让米拉变形 naia、总督或别人正式发了请柬 invited）；有请柬后可以去舞会 act1_manor_ball。夜里潜进金库 advance 设为 act1_manor_vault。船在对方答应借出的那一刻就写标记：萨丝批准借用海鸥号时写 act1.ship=seagull。离开时 advance 回 act1_hub。",

    anchor: "港口底下的古老排水道，岔路像蛛网一样，墙上有教团留下的烬火记号。入口可以从酒馆地窖（若序幕放过了鼠王，它会带路，写清楚它的样子）、码头排水口或旧学院下水口找到。没有带路的话要过几道关：认路（求生或调查 DC 13）、躲开塌陷的地板和一窝巨鼠、听出前面有人巡逻。沿路能找到失踪学徒皮普留下的粉笔箭头和一只掉落的鞋（支线）。走到深处的教团祭室把 advance 设为 act1_sewers_shrine；离开时 advance 回 act1_hub。",

    anchor: "排水道深处被改造成的祭室，烬火在黑曜石盆里燃烧，一名教团执事在主持仪式。墙上挂着一把刻满符文的矮人战斧——博林认得，那是他“死去”的哥哥达林的斧子（写 act1.darin_axe=true；斧子上的烬火痕迹说明达林可能没死，不要直接说破）。祭室的书架上有一叠写给教团的研究信，笔迹和废塔笔记的抄写者一样：莉拉会认出那是她的导师奥斯瓦尔德（她赞同 ≥ 20 才肯当众承认，写 quest.lyra.oswald=true；信里邀请她“一起完成我们的研究”）。祭室角落的笼子里关着失踪的学徒皮普（支线），他偷听到教团在等“七片印记聚齐”。若序幕里有同伴被交给了教团，他也被关在这里，可以用 recruit 救回。动手时在 JSON 写 combat 为 sewers_cult。抓住执事后的抉择：拷问他（写 act1.deacon=tortured，得知“教团在等七片印记聚齐”的线索和教团在港口的眼线），或放他回去当线人（写 act1.deacon=informant）。两种做法都能问出达林还活着、在龙骨群岛的教团据点（博林赞同 ≥ 20 时他才会追问到底，写 quest.borin.alive=true）。离开时 advance：act1_sewers 或 act1_hub。",

  act1_market: {

    anchor: "清早的鱼市和傍晚的灯笼街：渔获、香料、二手兵器、算命的、卖唱的，全港的消息都在这里转一圈。可以买东西（补给 5 金币一份，用 gold 和 supplies 字段；也可以买些小道具写进 items_add，价格合理即可），打听消息（谁在找印记持有者、黑潮会和港卫军最近的动静、关于灯塔的怪事）。这里有几个人在找人帮忙（支线，见下面列出的“可以接的支线”）：丢了丈夫渔船的寡妇奈尔、天天在码头边望海的老拾荒人“老海狗”、学院的老门房。米拉/奈雅在这里很自在，会被卖唱的认出来。离开时 advance 回 act1_hub。",

  act1_lighthouse: {
    title: "灯塔之夜", loc: "灰帆港 · 灯塔", bg: "linear-gradient(160deg,#6b3a2a,#26140f 60%,#0f0806)", level: 5, camp: false, act: 1,
    split: { flag: "act1.ship_intact", place: "码头", job: "拆掉码头上的炸药" },
    anchor: "航海图和船都到手的当晚，灰烬教团动手了：酒馆被砸，玛莎被绑走（若 act1.hostage=tom，被绑的是小汤姆；确定人质时写 act1.hostage=martha 或 tom），留话“一个小时内，带着印记持有者到灯塔来交换”。同时米拉的身份暴露：她传给教团的情报让教团知道了你们的航线和船（若 act1.naia_seen 为 true，玩家早已知道，现在她可以选择当面坦白）。把 act1.naia_exposed 设为 true，她从此显出真身（灰白皮肤、水银色头发、没有瞳孔的乳白眼睛），名字是奈雅。玩家必须当场或事后决定怎么处置她：杀掉、关押、接纳（写 act1.naia_fate = killed|imprisoned|recruited；killed 时她死去，imprisoned 时她离队被关在酒馆地窖）。其他同伴会强烈表态：赛勒涅、博林主张严惩，卡西安主张宽恕。教团还在码头埋了炸药，目标是你们的船：队伍可以拆分，一部分人去码头拆炸药，其余人去灯塔。谁去码头由玩家在界面上分派，码头的战斗和拆弹由程序结算并写 act1.ship_intact；你不要替玩家决定谁去哪里，也不要自己写 act1.ship_intact，可以在叙述里提醒玩家要分派。灯塔分底层、旋梯、灯室三层；千面母（教团间谍头子、奈雅的养母，永远不用同一张脸）带着无面刺客混在一群“平民”里等着，开战时她已经变成队伍里某个人的样子。动手时在 JSON 写 combat 为 lighthouse；若奈雅已被接纳且赞同度 ≥ 40，她可以和千面母对话让她动摇退场，用千面母的真名威胁也能让她投降。千面母会当着奈雅说出：她手里握着奈雅的“真名”，教团随时能用它收回她（奈雅在场、赞同度 ≥ 20 时，她事后才会告诉你真名意味着什么，写 quest.naia.name=true）。战后写 act1.martha_alive（人质是否活着），把 advance 设为 act1_dawn。",
    next: "act1_dawn", encounters: ["lighthouse"],
  },
  act1_dawn: {

  act2_ember_study: {
    title: "导师的书房", loc: "烬火岛 · 前哨书房", bg: "linear-gradient(160deg,#4f3a46,#1d1419 60%,#0b080a)", act: 2,
    anchor: "前哨里唯一干净的房间：书架、星图、一张堆满印记草图的长桌，壁炉里烧着黑火。莉拉的导师奥斯瓦尔德（温文尔雅的老法师）在这里研究仪式。若莉拉个人任务的第二步 quest.lyra.oswald 还没写，见到他本人时先补写。他真心欣赏莉拉，邀请她留下“一起完成我们的研究”，也会和玩家讲道理（印记是人类第一次有机会拿回神的力量）。这是莉拉个人任务的抉择（莉拉赞同 ≥ 20 才会认真谈；写 quest.lyra：killed 杀死导师、turned 说服他反水（说服 DC 17，若 act1.lyra_notes=burned 他会更受触动；第三幕他会带着学院残部来援）、joined 让莉拉接受邀请（她的龙化之路由此开始））。桌上摊着教团的仪式计划：他们要在烬冠山的祖坛上用七片印记唤醒烬王（写 act2.ritual_plan=true）。离开时 advance：act2_ember、act2_ember_forge 或 act2_hub。",
    next: ["act2_ember", "act2_ember_forge", "act2_hub"],
  },
  act2_ember_forge: {
    title: "熔炉厅", loc: "烬火岛 · 熔炉厅", bg: "linear-gradient(160deg,#7a3018,#2a0f07 60%,#110503)", act: 2, camp: false,
    anchor: "火山岩里挖出来的大厅，三座熔炉喷着烬火，头顶的铁链吊着冷却用的海水桶。博林的哥哥达林被改造成了“烬卫”：盔甲和皮肉烧在一起，缝隙里透出暗红烬光。若博林个人任务的第二步 quest.borin.alive 还没写，见到达林时先补写。达林不认得任何人，一见面就动手：在 JSON 写 combat 为 darin_forge（博林在场时会在战斗里唱铁炉堡战歌，唤醒由程序结算）。战后博林个人任务的抉择写 quest.borin：mercy 给达林一个痛快（同时写 act2.darin=killed）、woke 唤醒成功（程序已写 act2.darin=woke，达林恢复神智但伤得很重，留在岛上，第三幕会来援）、abandoned 放任不管（act2.darin=left）。离开时 advance：act2_ember 或 act2_hub。",
    next: ["act2_ember", "act2_hub"], encounters: ["darin_forge"],
  },
  act2_mist: {
    title: "雾隐岛", loc: "龙骨群岛 · 雾隐岛", bg: "linear-gradient(160deg,#6a7b7c,#262e2f 60%,#0e1212)", act: 2, loc2: true,
    anchor: "终年浓雾，高脚屋建在礁石和浅滩上，屋檐挂着用鲸骨和贝壳串成的风铃。这里住着“潮裔”：百年前被晨星骑士团献祭的渔村幸存者的后代。他们憎恨银龙，也恨晨星骑士（赛勒涅在这里会被敌视，孩子们会朝她扔石头），也不信任教团。一上岸就会被持鱼叉的潮裔战士围住，要说明来意（说服或威吓 DC 14，失败就被押去见长老）。瑟拉长老（独眼的老妇人）保管着誓约神殿的钥匙——一枚潮汐石。拿到钥匙的方式：①赢得潮裔的信任——帮他们击退袭击渔村的雾海巨妖（在 JSON 写 combat 为 mist_kraken），并说服长老（说服 DC 16，若 act2.murals 为 true、或赛勒涅愿意当众承认骑士团的罪，有优势），长老交出钥匙（写 act2.temple_key=given、act2.tideborn=ally）；②偷（隐匿 DC 15 + 巧手 DC 15，写 act2.temple_key=stolen、act2.tideborn=neutral，被发现就是 enemy）；③武力夺取（写 act2.temple_key=taken、act2.tideborn=enemy，永久失去这个盟友）。岛的另一头有潮裔的纪念礁和一间离群的小屋：advance 设为 act2_mist_memorial。离开时 advance 回 act2_hub。",
    next: ["act2_mist_memorial", "act2_hub"], encounters: ["mist_kraken"],
  },
  act2_mist_memorial: {
    title: "纪念礁", loc: "雾隐岛 · 纪念礁", bg: "linear-gradient(160deg,#5a6a70,#20282b 60%,#0b0e10)", act: 2,
    anchor: "岛的另一头，一片插满木桩的礁石：每根木桩代表一个被献祭的村民，很多桩子上没有名字（名字已经没人记得了——骨骼岛的壁画上刻着它们，支线）。潮裔每到大潮之夜会来这里唱一首没有歌词的歌。礁石后面有一间离群的小屋，住着一个不是潮裔的女人：她是伊芙，主教瓦尔多的妹妹，多年前逃离教团隐居在这里（洞悉 DC 15 看出她不是潮裔；赢得潮裔信任后长老也会引见）。她会说出哥哥也是献祭幸存者的后代、他真正想要的是什么（写 act2.eve=true；这是第三幕说服主教的关键），也可能托你带一封信给哥哥（支线）。赛勒涅在纪念礁前可以选择当众向潮裔下跪认罪（赛勒涅个人任务的走向会因此不同；潮裔对队伍的态度会软化）。若赛勒涅在队、quest.selene.diary 为 true 而 quest.selene.truth 还没写（航程里没遇到幽灵船，或者当时没谈成）：纪念礁最老的一根木桩上钉着一块锈蚀的晨星铭牌，是百年前一位骑士偷偷回来留下的忏悔——读懂它（历史 DC 12，或者由瑟拉长老、伊芙讲出当年的事），赛勒涅就明白了日记里的真相：骑士团为加固封印献祭了这里的渔村，幸存者的复仇让骑士团覆灭。这是她个人任务的第二步（她赞同 ≥ 20 时写 quest.selene.truth=true）。离开时 advance：act2_mist 或 act2_hub。",
    next: ["act2_mist", "act2_hub"],
  },
  act2_temple: {
    title: "誓约神殿", loc: "龙骨群岛 · 誓约神殿", bg: "linear-gradient(160deg,#6f8aa0,#25313b 60%,#0d1216)", act: 2, camp: false, level: 9,
    anchor: "退潮时，三座岛中间的海面裂开，一座白石神殿浮了出来，台阶上还挂着海草和发光的水母，潮汐石嵌进大门就开了。门厅的墙上刻着七个空着的掌印。第一重试炼——勇气：每个人都被拉进自己最恐惧之物的幻象，玩家的幻象由他的背景决定（具体写），同伴的幻象按他们的秘密写（赛勒涅：骑士团覆灭的那一夜；维克斯：莉丝被带走；卡西安：倒在他拳下的好友；博林：着火的铁炉堡；莉拉：学院的审判庭；奈雅：一面照不出脸的镜子）。可以要求检定，也可以用信念和行动通过；通过写 act2.trial_courage=true，然后 advance 设为 act2_temple_truth。退潮的时间有限，离开神殿要等下一次退潮（这里不能回锚地）。",
    next: ["act2_temple_truth"], gate: { act2_temple_truth: () => !!state.flags["act2.trial_courage"] },
  },
  act2_temple_truth: {
    title: "真相之厅", loc: "誓约神殿 · 真相之厅", bg: "linear-gradient(160deg,#5d7a92,#1f2b35 60%,#0b1014)", act: 2, camp: false,
    anchor: "一座圆形的大厅，地面是一整块镜面般的水。第二重试炼——真相：每位同伴必须站到水面中央，说出一个自己的秘密（照同伴资料里的“秘密”写，写得具体、有分量），水面才会让路。赞同度低于 20 的同伴会拒绝，玩家要说服他（检定或真心话）；玩家自己也要说出一件从没告诉过任何人的事。说出来的秘密会被其他同伴听到——写出他们的反应，可以用 approval 和 relation 调整。都说完写 act2.trial_truth=true，然后 advance 设为 act2_temple_heart。",
    next: ["act2_temple_heart"], gate: { act2_temple_heart: () => !!state.flags["act2.trial_truth"] },

  act2_temple_heart: {
    title: "誓约之心", loc: "誓约神殿 · 核心", bg: "linear-gradient(160deg,#8aa6bc,#2c3a46 60%,#0f1418)", act: 2, camp: false,
    anchor: "神殿最深处，一颗心脏大小的银色晶体悬在半空，缓缓跳动——“誓约之心”。第三重试炼——牺牲：必须放弃一件珍贵的东西，写 act2.sacrifice：item 一件珍贵物品（同时在 items_remove 里去掉它）、memory 一段记忆（玩家选一段和某位同伴的回忆，那位同伴会察觉你忘了）、draconic 20 点龙化值（程序扣；不够 20 点不能选）。三重试炼都过了，神殿核心展示全部真相（写 act2.revealed=true）：赫斯提雅拆开誓约寄存在七个人身上，是想借宿主重生——赛勒涅是她原本选中的容器。赫斯提雅现身（银发老妇人，鳞片在脸颊上发光），坦诚地提出交易：“把印记交给我选中的人，我会拯救这片海。”同伴们强烈表态（赛勒涅的反应最重；若是恋人，玩家可以完成她的考验）。就在这时，主教瓦尔多率众杀入（他通过奈雅的情报或奥斯瓦尔德追踪而来）。玩家要在主教抢到之前决定誓约之心怎么处置，写 act2.heart：hestia 交给赫斯提雅、player 自己吸收（龙化值 +30，程序加）、destroyed 交给潮裔销毁（只有 act2.tideborn=ally 时可以）。动手时在 JSON 写 combat 为 temple_raid。不管打没打赢，主教都会从密道撤走，并且掳走一位同伴（由程序决定是谁，你不要写）；没来得及处置的誓约之心也会被他抢走。之后把 advance 设为 act2_end。",
    next: "act2_end", encounters: ["temple_raid"],
  },
  act2_end: {
    title: "退潮之后", loc: "龙骨群岛 · 神殿外的礁石", bg: "linear-gradient(160deg,#6e7a86,#262c32 60%,#0e1114)", act: 2, camp: false, endAct: 2,
    enter: "templeAftermath",
    anchor: "神殿重新沉回海里。最近的系统记录里写着主教掳走了谁、誓约之心的下落（程序已经写好 act2.taken 和 act2.heart）。清点代价：被掳走的同伴留下的东西、其他同伴的反应（愤怒、自责、互相指责）。赫斯提雅若还信任玩家，会在梦里或幻象中最后说一句话。远处，烬冠山的方向升起一道黑烟——主教要在那里的祖坛唤醒烬王。船准备返航灰帆港，第三幕的战争在那里等着。对话 1~3 轮后，把 scene_end 设为 true，第二幕结束。",

  /* 第三幕：烬冠。被围的港口 → 战争会议 → 烬王的低语（最后一夜）→ 攻上烬冠山 → 祖坛 → 烬王 → 结局 */
  act3_1: {

    anchor: "船回到灰帆港时，港口大半已经是火海：教团唤醒了一头黑龙幼体，它在屋顶之间盘旋喷吐酸液，狂信徒趁乱放火，难民挤满了栈桥。船刚靠岸就有三拨人冲过来求救——码头（黑潮会的地盘，渔民和水手被困在着火的仓库里）、旧学院（学者和学徒守着最后的结界石）、总督府一带（港卫军在死守，平民躲在地窖里）。玩家只能先救一片，写 act3.saved_first：docks、academy 或 manor（先救的那一方会记住，另外两片损失惨重），然后 advance 到对应的街区：act3_docks_fire、act3_academy_fire 或 act3_manor_fire。",

  act3_docks_fire: {
    title: "燃烧的码头", loc: "灰帆港 · 燃烧的码头", bg: "linear-gradient(160deg,#7a4022,#2a140a 60%,#100704)", act: 3, camp: false,
    anchor: "码头的仓库一座接一座地烧，鱼油桶在爆炸，黑潮会的打手和渔民挤在栈桥尽头，海里漂着翻倒的船。老鳗（若还活着）在金鳗的甲板上指挥手下救火，看见你们会露出复杂的表情——这是赢回黑潮会的机会。要做的事：把被困在仓库里的人救出来（运动或杂技 DC 15，或者用法术灭火）、挡住扑下来的黑龙幼体（在 JSON 写 combat 为 harbor_wyrmling）。救下码头，黑潮会会记住（即使之前为敌，老鳗也愿意谈条件）。之后带人退回醉龙酒馆：advance 设为 act3_haven。",

  act3_academy_fire: {

    anchor: "旧学院的主楼塌了一半，残余的学者和学徒围着三块发光的结界石死守，结界一灭，整条街都会被酸液吞掉。若奥斯瓦尔德已经反水（quest.lyra=turned），他就在这里指挥，看到莉拉会红了眼眶；否则是学院的老门房在硬撑（若做过他的支线，他会认出你们）。要做的事：稳住结界石（奥秘 DC 15，莉拉在场有优势）、把学徒们从塌楼里救出来、挡住黑龙幼体（在 JSON 写 combat 为 harbor_wyrmling）。救下学院，学院残部会记住。之后带人退回醉龙酒馆：advance 设为 act3_haven。",

  act3_manor_fire: {

    anchor: "总督府前的广场成了最后的防线，港卫军用马车和家具堆起路障，平民躲在总督府的地窖里。萨丝（若还信任你们）在最前面，盔甲上全是酸液烧的洞；总督（若还在位）躲在楼上发号施令，没人听他的。要做的事：守住路障（战斗或指挥：说服或威吓 DC 15 让港卫军稳住阵脚）、把地窖里的平民转移到船上、挡住黑龙幼体（在 JSON 写 combat 为 harbor_wyrmling）。救下总督府，港卫军会记住。之后带人退回醉龙酒馆：advance 设为 act3_haven。",

  act3_haven: {
    title: "避难所", loc: "灰帆港 · 醉龙酒馆", bg: "linear-gradient(160deg,#5a4433,#211812 60%,#0d0907)", act: 3, hub: true, campFree: true, jail: true, tavern: true,
    anchor: "醉龙酒馆成了避难所：大堂里躺满伤员，玛莎（若还活着）在分发绷带和热汤，小汤姆跑前跑后，地窖里挤着孩子。这里是第三幕的据点（睡觉写 camp: true，不耗补给）。外面的港口还在烧，各处有人求助（支线，见下面列出的“可以接的支线”）。第一幕对酒馆的升级在这里看得出来（世界标记 tavern.*）：修缮过客房（tavern.rooms）的话，伤员有床有被，楼上还能腾出安静的房间；请过吧女（tavern.barmaid）的话，她带着难民熬汤、分粮、四处搜罗；开过地下情报站（tavern.intel）的话，地窖成了指挥所，跑腿的孩子们带回港口各处和烬冠山的消息。没升级过的就是挤、乱、缺人手，玛莎一个人忙不过来。这一幕还可以继续升级。能去的地方：战争会议 act3_council（召集盟友、定攻山的计划）；被围的街巷 act3_streets（巷战、救人、找补给）。定下计划、准备好之后，去开战争会议。",

    anchor: "烟雾弥漫的街巷：倒塌的房子、被酸液腐蚀的石墙、在废墟里翻找的人，偶尔有狂信徒的小队在搜捕“印记持有者”。可以在这里找补给（调查 DC 13，用 supplies 字段加 1~2 份）、救被压在废墟下的人、和小股教团交手（不需要正式战斗时直接叙述，打大仗写 combat 为 ember_slope 太重了，不要用）。支线的目标常常在这里（见“进行中的支线”）。之后 advance 回 act3_haven。",

    anchor: "醉龙酒馆的大堂清出一张长桌，各方的首领陆续到来。【世界标记】后面列出了程序按之前所有选择算出的盟友（每一方的来由也写在那里）：只让这些盟友出场，没列出的阵营不会来，或者派人来拒绝/冷嘲热讽（例如被你得罪过的黑潮会、被武力夺走钥匙的潮裔）。每位盟友的首领说几句话、提出条件或要求，盟友之间也会吵起来（港卫军和黑潮会互相看不顺眼，潮裔不信任任何陆地上的人），玩家要居中调停（说服 DC 15，失败会有人当场离席——但程序算出的盟友不会真的少）。这一场是“选择有回响”的集中兑现，可以多写几轮。若队伍里还没定的个人任务抉择（例如赛勒涅、奈雅），同伴会在会后找玩家。玩家定下攻山的计划后，把 advance 设为 act3_whisper。",

    goal: "两条路：①在汤里下药——用厨房里的草药（医疗或巧手 DC 15，不能惊动帮厨），让黄昏换岗的守卫睡着，矿坑那边就空了，囚犯能自己跑；做这件事要答应格里姆别伤那些被强征的年轻人。②不下药，从前哨军需官那里偷矿坑钥匙（隐匿 DC 15 + 巧手 DC 14），或者让格里姆带你们走厨房的运煤道（说服 DC 14，他要看到你们真的会带囚犯走）。两种做法都会惊动前哨，只是一早一晚。格里姆最后会求你们带他一起离开；答应他，他会把熔炉厅的守备图画给你们。卡西安会站在格里姆这边，赛勒涅担心下药会连累无辜的帮厨",
    reward: { supplies: 2, gold: 20 }, rewardText: "补给 +2，20 金币（格里姆攒的私房钱）" },
  siren_verse: { name: "海妖的最后一句", act: 2, at: ["act2_siren", "act2_hub"], need: () => state.log.some(e => e.s === "act2_siren"), // 航程是随机抽的，要真的听过海妖之歌
    hook: "海妖之歌唱到天亮才停。奈雅（如果她在队里；不在就由莉拉或卡西安记下）说副歌的最后一句不是人话，是潮裔的古语，意思是“门在退潮时开，名字在骨头里”。她只记得半句，想把它补全——那可能是进誓约神殿的另一条路",
    goal: "补全这首歌：①在雾隐岛找还记得古语的潮裔老人（act2_mist，说服或表演 DC 14，要先用行动证明你们不是来抢东西的）；②在骨骼岛的头骨洞穴里找刻着同样句子的壁画（act2_bone_skull，历史或奥秘 DC 15）；③让奈雅自己唱（表演 DC 16，失败会被歌声勾走一段记忆，叙述里写她忘了什么）。补全之后，这句歌词会提醒你们神殿里的一处机关，但不要替玩家解开神殿的试炼。莉拉兴奋，赛勒涅警惕，维克斯问这歌能不能卖钱",
    reward: { gold: 30, supplies: 1 }, rewardText: "30 金币（潮裔老人给的谢礼），补给 +1" },
  ghost_letters: { name: "幽灵船上的家书", act: 2, at: ["act2_ghost", "act2_hub"], need: () => state.log.some(e => e.s === "act2_ghost"), // 要真的遇到过幽灵船
    hook: "幽灵船消失前，亡灵骑士把一捆用油布包好的信塞给你：船员舱里每一张吊床下都有一封没寄出的信，收信人写的都是雾隐岛上的名字。百年前他们出发那天，没人敢告诉家里人自己要去做什么。他请你们把信带回去——如果岛上还有人记得那些姓",
    goal: "把信带到雾隐岛的纪念礁（act2_mist_memorial），一封封念给潮裔听。潮裔老人会认出自己祖母或曾祖母的姓氏，有人会哭，有人会把信扔进火里。也可以先把信交给瑟拉长老（说服 DC 14，她会决定哪些信该念）；或者把信卖给学院派来的收旧人（act2_hub，40 金币，赛勒涅会反对）。念完信，潮裔会告诉你们一条只有退潮时才露出来的礁石路。赛勒涅在意这些死人，卡西安愿意陪你们念完",
    reward: { supplies: 1, items: ["强效治疗药水"] }, rewardText: "补给 +1，强效治疗药水（潮裔药师配的谢礼）" },
  eve_bundle: { name: "伊芙的旧信", act: 2, at: ["act2_mist_memorial"], need: () => ["taken", "done"].includes(state.flags["side.eve_letter"]),
    hook: "伊芙收着哥哥从前写来的信，鲸骨盒子里只剩最后几封。她说瓦尔多年轻时真的想带她走，最后一封信里写着“等我弄明白银龙当年为什么选那个村子”。之后信就断了。她想知道那之后发生了什么，又不敢自己去看",
    goal: "去烬火岛前哨的书房（act2_ember_study）找瓦尔多的旧笔记：桌上有一叠没寄出的信（调查 DC 15），或者趁奥斯瓦尔德不在时翻他的书架（隐匿 DC 15）。信里写着瓦尔多查到的真相：被献祭的村子是他母亲的家乡，他因此恨上了银龙。把信带回给伊芙；也可以只告诉她一部分（欺瞒 DC 14，她会察觉，但不会逼问）。莉拉会想知道导师到底在研究什么，赛勒涅不赞成瞒她",
    reward: { supplies: 1, gold: 25 }, rewardText: "补给 +1，25 金币（伊芙攒的，让你们路上用）" },
  eel_wreck: { name: "被抹掉名字的船员", act: 2, at: ["act2_hub", "act2_bone"], need: () => state.flags["side.eel_clerk"] === "done",
    hook: "账本上记着黑潮会往龙骨群岛运过一批货，收货人是教团前哨；那艘船后来没回灰帆港。皮特（如果上一轮救过他）说那条船搁浅在骨骼岛背面，船上的黑潮会水手还在岛上，靠挖龙骨的边角料活命；老鳗从没派人来找过他们。没遇到皮特的话，就按账本上的名字和潮裔的闲话拼出位置。",
    goal: "去骨骼岛背面找那艘搁浅的走私船：①救出还活着的水手（医疗 DC 13 处理伤口，或说服 DC 14 让他们相信你们不是老鳗派来灭口的）；②拿走船上的账本下半册和货（巧手 DC 14；货是教团封在陶罐里的烬火毒，打开要体质豁免 DC 13）；③也可以只拿账本就走，让水手自己决定。水手会告诉你们老鳗把他们的名字从账上抹了，黑潮会早就不认他们。带他们回锚地、给他们一条小船、或者只拿账本走，都会影响第三步他们会不会出现。",
    reward: { gold: 40, supplies: 2 }, rewardText: "40 金币（沉船上的私货钱），补给 +2" },

  refugees: { name: "最后一艘船", act: 3, at: ["act3_haven"],
    hook: "酒馆地窖里挤着三十多个孩子和老人，港口只剩一艘还能出海的船，船长要价，教团的人在码头巡逻",
    goal: "把难民从酒馆护送到码头上船（在街巷里避开或打退教团小队，和船长谈价钱或者用武力说服），看着船离港",
    reward: { flags: {} }, rewardText: "难民平安离港；玛莎和小汤姆会记住这件事" },
  tom_courage: { name: "小汤姆的勇气", act: 3, at: ["act3_haven"], need: () => state.flags["side.tom_errand"] === "done",
    hook: "小汤姆说他知道一条从酒馆地窖通往码头的旧排水道，想带着信去叫援兵，玛莎不许，他偷偷来找你。他腿上的旧伤还没有完全好，可他说这次不会再拖后腿了——之前在后巷和院子里练的那些，他想用上",
    goal: "决定要不要让他去（或者陪他去）：排水道里有狂信徒，他一个人很危险；成功的话援兵会早一步赶到",
    reward: { supplies: 2 }, rewardText: "补给 +2；小汤姆第一次挺直了腰" },
  ward_stones: { name: "学院的结界石", act: 3, at: ["act3_haven", "act3_academy_fire"],
    hook: "学院残部守着的结界石快撑不住了，学者们需要从旧学院的废墟里挖出备用的结界石核心",
    goal: "在街巷里（act3_streets）找到并护送备用的结界石核心到学院（奥秘 DC 15 判断哪块还能用），挡住来抢的狂信徒",
    reward: { flags: {} }, rewardText: "学院残部愿意派人上山（第三幕多一方盟友）" },
  eel_deal: { name: "老鳗的最后一笔", act: 3, at: ["act3_haven", "act3_docks_fire"],
    hook: "老鳗（若还活着）派人送来口信：黑潮会的船队还剩七艘船，他愿意谈——价钱另说",
    goal: "去和老鳗谈（他要的可能是钱、赦免、或者一个人情；维克斯和卡西安会有很强的意见），谈成就写 done",
    reward: { flags: { "act1.eel": "ally" } }, rewardText: "黑潮会船队成为盟友" },

  // DS：第三幕支线与三条事件链的第三步
  cistern_water: { name: "干涸的蓄水池", act: 3, at: ["act3_haven", "act3_streets"],
    hook: "避难所的水缸见了底。老城的地下水池有两个：鱼市下面那个被教团投了烬火毒，水面浮着一层灰；总督府后巷那个还干净，可要穿过被狂信徒搜捕的街巷。玛莎把最后半壶水留给伤员，自己嘴唇已经起皮",
    goal: "在街巷找到干净的水池（求生或调查 DC 14 分辨哪口井还能喝），打水带回来（运动 DC 13；卡西安可以净化一口被污染的小井，但要用掉一次神术）。水只够救一处：地窖里的孩子、街垒上的守军、还是伤员。玩家选，叙述里写清楚另一处的人怎么熬过去。来回路上会撞上教团小队（隐匿 DC 14 绕开，或者让博林把人引开）",
    reward: { supplies: 2 }, rewardText: "补给 +2（干净的水和能烧开的柴）" },
  bell_tower: { name: "钟楼", act: 3, at: ["act3_haven", "act3_streets"],
    hook: "港口旧钟楼的钟绳被人割断了，守钟人趴在楼梯上，背后插着一支弩箭。那口钟是唯一能盖过喊杀声的东西：敲响它，散在各处的人就知道避难所在哪；也会把教团引过来。萨丝说：“你决定，我去守楼梯。”",
    goal: "修好钟绳：巧手 DC 14 接上断绳，或者用船缆、博林的腰带、教堂的旧旗绳代替（运动 DC 12）。敲钟之前要先决定什么时候敲：现在敲，能把街上的人引回来，但教团也会顺着声音来（要顶住一波狂信徒，叙述或战斗）；等天黑再敲，教团看不清，但街上的人可能撑不到那时候。也可以不敲，用钟楼的高处观察教团的动向（察觉 DC 13，给攻山多一条情报）",
    reward: { supplies: 1, gold: 20 }, rewardText: "补给 +1，20 金币（守钟人藏在钟座下的钱袋）" },
  deserters: { name: "三个逃兵", act: 3, at: ["act3_haven"],
    hook: "萨丝把三个想逃的港卫军锁在酒窖里，钥匙放在桌上。他们一个是刚入伍半年的渔夫儿子，一个是有两个孩子的父亲，还有一个从头到尾不说话。萨丝说军法写着“临阵脱逃者斩”，可外面就是他们的家。她让你来判——不是因为你是好人，是因为她下不了手",
    goal: "和三个人谈（洞悉 DC 13 看出谁是真心害怕、谁在撒谎；那个不说话的其实想带另外两个人去投教团）。处置：①按军法（萨丝执行，港卫军不会乱，但酒馆里的人会记住）；②放他们去守平民（他们会去街垒，其中一个可能活不下来）；③让那个内应带假情报回教团（欺瞒 DC 15），成功能给攻山帮上忙，失败会泄露避难所的位置。决定后要亲自告诉萨丝，不要替她动手",
    reward: { supplies: 1, flags: { "act1.sath_trust": true } }, rewardText: "补给 +1，萨丝记住了你的判断（港卫军更信任你）" },
  ash_urn: { name: "骨灰", act: 3, at: ["act3_haven"],
    hook: "避难所角落里躺着一个被俘的年轻狂信徒，胸口被酸液烧穿了。他怀里抱着一只粗陶坛，里面是他哥哥的骨灰——哥哥也是教团的人，去年死在港口。他说他们不是生来就是这样的，求你们把坛子送到城南他母亲手里，说完就昏过去了",
    goal: "找到城南的老屋（act3_streets，调查 DC 13；那一片已经被烧了一半）。母亲还在，守着半堵墙。选择：①把坛子交给她，听她说完话（卡西安赞同；她会把家里最后一点钱塞给你们）；②把坛子交给萨丝当教团罪证（港卫军会记住，但母亲永远等不到）；③不送，把坛子留在避难所（年轻人死前会一直问）。回来的路上如果带着坛子，教团的巡逻会以为你们在运送印记，会更凶",
    reward: { supplies: 1 }, rewardText: "补给 +1（老屋里还剩一点能用的东西）" },
  last_cask: { name: "最后一桶龙息", act: 3, at: ["act3_haven", "act3_streets"],
    hook: "酒馆地窖最里面压着一桶“龙息”陈酿，是玛莎亡夫留下的最后一桶，桶身上还有他刻的字。博林说该打开，让挤在地窖里的人喝一口热的；玛莎说那是给伤员消毒用的，谁也别碰。桶被塌下来的横梁压住了，要挪开就得先撑住那面墙",
    goal: "把桶挖出来：用酒馆的旧撬棍和木桩撑住横梁（运动 DC 15；博林在场有优势），或者从地窖侧面挖一条小通道（求生或巧手 DC 14，但会弄塌半面墙）。桶打开之后决定给谁：伤员（消毒和止痛）、地窖里的难民（一人一口，士气会好起来）、还是留给守街垒的人。剩下一半还能装瓶带走。玛莎会看着你们，什么都不说",
    reward: { supplies: 2, gold: 20 }, rewardText: "补给 +2，20 金币（桶底沉着几枚旧银币）" },
  martha_last_letter: { name: "最后一封没拆的信", act: 3, at: ["act3_haven"], need: () => state.flags["side.martha_letters"] === "done" && state.flags["act1.martha_alive"] !== false,
    hook: "被围的第二天夜里，玛莎把最后一封信放在桌上，信封没拆，火漆还是完整的。她说这封是亡夫留给“读到这封信的人”的，不是给她的。酒馆里挤满了人，她问你：现在拆，还是等打完再拆",
    goal: "陪玛莎拆信，或者劝她先别拆（洞悉 DC 13 能看出她其实怕的是信里怪她）。信里写着亡夫早就知道地窖暗格里有什么，也知道自己回不来；最后一句是请读到信的人替他守住酒馆和玛莎。也可以按信里的提示去酒馆后墙挪开旧柜子（调查 DC 13），找到他藏的一枚旧银币和一张手画的港口地图。不管拆不拆，玛莎都会把信收进围裙口袋，然后回去给伤员盛汤",
    reward: { supplies: 2, gold: 25 }, rewardText: "补给 +2，25 金币（玛莎把亡夫留下的旧银币塞给你们）" },
  sath_stand: { name: "萨丝的街垒", act: 3, at: ["act3_haven", "act3_streets"], need: () => state.flags["side.sath_ledger"] === "done",
    hook: "围城第三天，萨丝决定亲自守最后一道街垒。出发前她把一串旧钥匙交给你：总督府地窖里还锁着港卫军的补给和几个走不动的伤员，钥匙能开，但地窖的门被塌下来的石梁顶住了。她说：“救人还是拿补给，你定。别两样都想要。”",
    goal: "去街巷的总督府后门（act3_streets）：先撑住石梁（运动 DC 15；博林在场有优势），再决定先搬人还是先搬补给。搬人要多花时间，补给可能被趁乱抢走；搬补给快，但伤员会多等一阵，其中一个撑不住。也可以让卡西安留下来照看伤员、你们去搬补给（卡西安赞同，他会晚一步回来）。完事回去告诉萨丝",
    reward: { supplies: 2, items: ["港卫军胸甲"] }, rewardText: "补给 +2，港卫军胸甲（萨丝从自己身上解下来的）" },
  eve_witness: { name: "伊芙要上山", act: 3, at: ["act3_haven", "act3_council"], need: () => state.flags["side.eve_bundle"] === "done",
    hook: "攻山前的战争会议上，一个披着潮裔斗篷的女人站起来：是伊芙。她搭潮裔的渔船来了，带着那叠信。她说：“瓦尔多认不认得我，我都得去。他要是还肯听人说话，那个人只能是我。”萨丝反对，玛莎沉默，奈雅（如果在）第一个说“让她去”",
    goal: "带伊芙穿过街巷到山脚（act3_streets）：路上教团在搜捕印记持有者，要隐匿 DC 15 绕开，或者让奈雅给伊芙换一张脸（欺瞒 DC 14；伊芙不喜欢，但会答应）。到了山脚，把伊芙安顿在攻山队伍的后队，答应她在祖坛上先开口。不要在祖坛替玩家决定辩论的结果——说服成不成，由玩家自己和证据决定",
    reward: { flags: { "act2.eve": true }, supplies: 1 }, rewardText: "伊芙会亲自作证（说服主教时多一份证据），补给 +1" },

// 改龙化值的唯一入口：跨过门槛时解锁能力、在场同伴按看法调整赞同度
function addDraconic(ref, n, notes) {
  const before = dracOf(ref), after = clamp(before + n, 0, 100); if (after === before) return;
  if (ref === "player") state.player.draconic = after; else state.companions[ref].draconic = after;
  const who = ref === "player" ? "" : PEOPLE[ref].name;
  const line = (t, cls = "") => notes ? notes.push([t, cls]) : push("sys", t, { cls: cls === "up" ? "appr-up" : cls === "down" ? "appr-down" : "" });
  line(`${who}龙化值 ${sgn(after - before)}（${after}）`);
  for (const m of MARKS.filter(m => before < m.at && after >= m.at)) line(`${who || "你"}的印记觉醒了：${m.name}——${m.desc}`, "up");
  if (ref !== "player") return;
  for (const t of [40, 60, 80].filter(t => before < t && after >= t))
    for (const id of party()) { const [d] = DRAGON_VIEW[id] || [0]; if (d) { state.companions[id].approval = clamp(state.companions[id].approval + d, -100, 100); line(`${PEOPLE[id].name}看着你掌心蔓延的鳞片，赞同度 ${sgn(d)}`, d > 0 ? "up" : "down"); } }
}

const $ = id => document.getElementById(id);
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
const mod = s => Math.floor((s - 10) / 2);
const sgn = n => (n >= 0 ? "+" : "") + n;
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const num = (v, lim) => clamp(Math.round(Number(v) || 0), -lim, lim);
const str = (v, n) => String(v ?? "").slice(0, n);

function placeholder(id) {
  const p = PEOPLE[id] || { name: "你", color: "#a07a3c" };
  const label = id === "player" ? (state?.player?.name || "你") : p.name;
  const c = id === "player" ? "#a07a3c" : p.color;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 300'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${c}' stop-opacity='.7'/><stop offset='1' stop-color='#120c08'/></linearGradient></defs><rect width='200' height='300' fill='url(#g)'/><circle cx='100' cy='108' r='44' fill='#0b0705' fill-opacity='.55'/><path d='M14 300C20 206 58 168 100 168S180 206 186 300Z' fill='#0b0705' fill-opacity='.55'/><text x='100' y='122' text-anchor='middle' font-size='34' fill='#efe3cb' fill-opacity='.8' font-family='serif'>${label.replace(/[<&>']/g, "").slice(0, 1)}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
const failed = new Set();
function portrait(img, id, expr) {
  if (id === "player" && state?.player?.portraitData) { img.src = state.player.portraitData; return; }
  const cands = [];
  if (id === "naia") { // 奈雅分伪装和真身两种样子，表情差分命名为 naia_true_smile.webp 这样
    const form = naiaTrue() ? "true" : "disguise";
    if (expr && expr !== "neutral") cands.push(`portraits/naia_${form}_${expr}.webp`);
    cands.push(`portraits/naia_${form}.webp`);
  }
  else if (id !== "player") {
    if (id === "darin" && state?.flags?.["act2.darin"] === "woke") cands.push("portraits/darin_woke.webp"); // 被战歌唤醒之后的样子
    if (expr && expr !== "neutral") cands.push(`portraits/${id}_${expr}.webp`);
    cands.push(`portraits/${id}_neutral.webp`);
  }
  const list = cands.filter(u => !failed.has(u));
  const next = () => {
    const u = list.shift();
    if (!u) { img.onerror = null; img.src = placeholder(id); return; }
    img.onerror = () => { failed.add(u); next(); };
    img.src = u;
  };
  next();
  img.alt = id === "player" ? (state?.player?.name || "你") : (PEOPLE[id]?.name || "");
}
function toast(text, kind) {
  const t = el("div", "toast" + (kind ? " " + kind : ""), text);
  $("toasts").append(t);
  setTimeout(() => t.remove(), 2700);
}

/* 存档：浏览器 localStorage 一份；在本机服务（开始游玩.cmd）上另外写进硬盘 .dragon-oath-local/saves，
   服务器覆盖前会留历史备份。读档时取两边较新的一份。 */
const DISK_KEY = k => k === AUTO ? "auto" : "slot" + k.slice(-1);
const SAVE_FORMAT = "dragon-oath-save";
const disk = { on: false, meta: {}, backups: [], pending: {}, writing: {} };
let saveWarnAt = 0;
function saveWarn(msg) { if (Date.now() - saveWarnAt > 60000) { saveWarnAt = Date.now(); toast(msg, "down"); } }
const metaOf = p => ({ t: p.t, name: p.state.player.name, scene: p.state.scene, combat: !!p.state.combat });
function snapshot() { const s = JSON.parse(JSON.stringify(state)); s.log.forEach(e => delete e.live); return { t: Date.now(), state: s }; }
function save(key) {
  if (!state || state.phase !== "play") return false;
  key = key || AUTO;
  let p;
  try { p = snapshot(); } catch (e) { return false; }
  let local = true;
  try { localStorage.setItem(key, JSON.stringify(p)); } catch (e) { local = false; }
  if (disk.on) diskWrite(key, p);
  else if (!local) { if (key === AUTO) saveWarn("自动存档失败：浏览器存储已满或不可用。请在存档菜单里导出备份。"); else toast("存档失败：浏览器存储不可用", "down"); }
  return local || disk.on;
}
async function diskWrite(key, p) {
  disk.pending[key] = p;
  if (disk.writing[key]) return; // 正在写就只留最新的一份，写完再补
  disk.writing[key] = true;
  try {
    while (disk.pending[key]) {
      const next = disk.pending[key]; delete disk.pending[key];
      try {
        const res = await fetch("/__save/slot/" + DISK_KEY(key), { method: "PUT", mode: "same-origin", credentials: "omit", headers: { "Content-Type": "application/json" }, body: JSON.stringify(next) });
        if (!res.ok) throw new Error("HTTP " + res.status);
        disk.meta[DISK_KEY(key)] = metaOf(next);
      } catch (e) { saveWarn("硬盘存档失败：请确认“开始游玩.cmd”的窗口还开着。浏览器里仍有一份存档。"); }
    }
  } finally { disk.writing[key] = false; }
}
async function diskGet(path) {
  try { const res = await fetch("/__save/" + path, { mode: "same-origin", credentials: "omit", cache: "no-store" }); return res.ok ? await res.json() : null; } catch (e) { return null; }
}
async function diskList() {
  const d = await diskGet("list"); if (!d) return false;
  disk.on = true; disk.meta = d.slots || {}; disk.backups = d.backups || [];
  return true;
}
function readSave(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }
function slotMeta(key) {
  const l = readSave(key), lm = l?.state?.player ? metaOf(l) : null, dm = disk.meta[DISK_KEY(key)];
  return dm && (!lm || dm.t > lm.t) ? { ...dm, from: "disk" } : lm ? { ...lm, from: "local" } : null;
}
async function loadSave(key) { const m = slotMeta(key); return !m ? null : m.from === "disk" ? diskGet("slot/" + DISK_KEY(key)) : readSave(key); }
const validState = s => !!s && typeof s === "object" && s.phase === "play" && !!s.player && Array.isArray(s.log) && !!SCENES[s.scene];
// 读进来的存档统一整理：去掉没写完的条目；旧存档的条目没有场景标记，按记录里的章节标题补上
function tidyLog(s) {
  // 旧存档没有后来加的同伴
  for (const [id, cd] of Object.entries(COMPANIONS)) if (!s.companions[id]) {
    const hp = cd.hp + ((s.player.level || 1) - 1) * Math.max(1, Math.floor(CLASSES[cd.kit].hd / 2) + 1 + mod(cd.ab.con));
    s.companions[id] = { recruited: false, alive: true, taken: false, approval: 0, romance: "none", hp, hpMax: hp };
  }
  const naia = s.companions.naia;
  if (naia.fate === "imprisoned" && naia.left) { naia.jailed = true; naia.left = false; }
  const chart = s.flags?.["act1.chart"]; if (chart && chart !== "opened" && !s.flags["act1.key"]) s.flags["act1.key"] = chart; // 旧存档：航海图原本直接锁在总督府
  s.act ||= 0;
  delete s.pendingWake; // 读档时不补写醒来的那一段
  s.log.forEach(e => delete e.live); s.log = s.log.filter(e => e.t || e.k === "chapter");
  const byTitle = Object.fromEntries(Object.entries(SCENES).map(([id, sc]) => [sc.title, id]));
  let cur = Object.keys(SCENES)[0];
  for (const e of s.log) { if (e.k === "chapter" && byTitle[e.t]) cur = byTitle[e.t]; if (!e.s) e.s = cur; }
}
function loadState(s) {
  state = s; tidyLog(state); catchUpLevel();
  lastAction = null; pick = null; cbGen++;

// 开页时和硬盘对一次：硬盘更新（换了浏览器、清过缓存）就换成硬盘的；浏览器更新就补写到硬盘
async function diskInit() {
  if (!LOCAL_GPT) return;
  const boot = state, bootLen = state ? state.log.length : -1;
  if (!(await diskList())) return;
  for (const key of [AUTO, SLOT(1), SLOT(2), SLOT(3)]) {
    const l = readSave(key), dm = disk.meta[DISK_KEY(key)];
    if (l?.state?.player && (!dm || l.t > dm.t)) diskWrite(key, l);
  }
  const l = readSave(AUTO), dm = disk.meta.auto;
  const untouched = state === boot && (!state || state.log.length === bootLen) && !busy;
  if (dm && (!l || dm.t > l.t) && untouched) {
    const sv = await diskGet("slot/auto");
    if (sv && validState(sv.state) && state === boot) {
      try { localStorage.setItem(AUTO, JSON.stringify(sv)); } catch (e) {} // 补回浏览器里的副本，时间戳保持不变
      loadState(sv.state); toast("已读取硬盘上的最新存档");
    }

}
async function exportSave() {
  if (!state || state.phase !== "play") return;
  const p = Object.assign({ format: SAVE_FORMAT, version: 1 }, snapshot());
  const filename = `醉龙酒馆-${state.player.name}-${new Date(p.t).toLocaleString("zh-CN").replace(/[\/:\s]/g, "-")}.json`;
  // claude.ai 里页面不能直接下载，要走 downloads 能力，由玩家确认保存
  const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename, data: JSON.stringify(p) }); toast("已导出存档文件"); }
    catch (e) { if (e?.code !== "declined") toast(e?.code === "rate_limited" ? "上一个保存窗口还没处理，稍后再试" : "这里不能导出文件", "down"); }
    return;
  }
  const a = el("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(p)], { type: "application/json" }));
  a.download = filename;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("已导出存档文件");
}
async function readImport(file) {
  try {
    const d = JSON.parse(await file.text());
    return validState(d?.state) ? d : null;
  } catch (e) { return null; }
}

// 在场的同伴：序幕里酒馆的人都在；之后是入队的同伴，加上这一场能遇到的人（meet）和能救回的人（rescue）
function present() {
  const sc = SCENES[state.scene];
  if (sc.with) return party().includes(sc.with) ? [sc.with] : [];
  if (sc.alone) return [];
  if (!state.act) return Object.keys(COMPANIONS).filter(id => {
    const c = state.companions[id];
    if (!inAct(id) || !c.alive || c.taken) return false;
    if (id === "vex" && state.flags["prologue.vex_left"]) return false;
    return true;
  });
  const out = party();
  for (const id of Object.keys(COMPANIONS)) {
    const c = state.companions[id];
    if (out.includes(id) || !c.alive || !inAct(id) || c.left) continue;
    if (c.jailed) { if (sc.jail) out.push(id); continue; }
    if (c.taken ? sc.rescue : sc.meet?.includes(id) && (!sc.meetIf?.[id] || sc.meetIf[id]())) out.push(id);
  }
  return out.filter(id => !awayIds().includes(id));
}
function party() { return Object.keys(COMPANIONS).filter(id => state.companions[id]?.recruited && !state.companions[id].taken && !state.companions[id].jailed && state.companions[id].alive); }

/* 等级：里程碑制，不攒经验。同伴始终和玩家同级（state.player.level 就是全队等级）。 */
const partyLevel = () => state?.player?.level || 1;
const profBonus = lvl => 2 + Math.floor((Math.max(1, lvl) - 1) / 4); // 1–4 级 +2，5–8 级 +3，9–12 级 +4
const ASI_LEVELS = [4, 8, 12];
// 同伴的属性：属性提升后存在 state.companions[id].ab，没有就用角色卡原值
const abOf = who => who === "player" ? state.player.abilities : state.companions[who]?.ab || COMPANIONS[who].ab;

function bonusFor(who, key) {
  // who: "player" | companion id ; key: skill | ability | "attack" | "save_xxx"
  const isP = who === "player";
  const ab = abOf(who);
  const profs = isP ? state.player.profs : COMPANIONS[who].prof;
  const pb = profBonus(partyLevel());
  if (key === "attack") {
    const atk = isP ? CLASSES[state.player.cls].atk : [COMPANIONS[who].atk];
    const best = Math.max(...atk.map(a => mod(ab[a])));
    return { total: best + pb, parts: [["属性", best], ["熟练", pb]], label: "攻击" };
  }
  if (key.startsWith("save_")) {
    const a = key.slice(5); const m = mod(ab[a]), gs = gearBonus(who).save;
    return { total: m + gs, parts: gs ? [[AB[a], m], ["装备", gs]] : [[AB[a], m]], label: AB[a] + "豁免" };
  }
  if (AB[key]) { const m = mod(ab[key]); return { total: m, parts: [[AB[key], m]], label: AB[key] }; }
  const [name, a] = SKILLS[key];
  const m = mod(ab[a]); const p = profs.includes(key) ? pb : 0;
  const parts = [[AB[a], m]]; if (p) parts.push(["熟练", p]);
  return { total: m + p, parts, label: name };
}
const kitOf = who => who === "player" ? state.player.cls : COMPANIONS[who].kit;
// 每升一级的生命：生命骰的一半 + 1 + 体质调整值（取平均值，不掷骰），至少 1
const hpGain = who => Math.max(1, Math.floor(CLASSES[kitOf(who)].hd / 2) + 1 + mod(abOf(who).con));
// 升到 to 级：全队一起升，满血；4/8/12 级玩家自己分配属性提升，同伴自动给主属性 +2
function levelUp(to) {
  const p = state.player, from = p.level || 1;
  to = clamp(Math.round(to), 1, 12);
  if (to <= from) return null;
  const before = growth(p.cls, from), hpBefore = p.hpMax;
  for (let L = from + 1; L <= to; L++) {
    p.hpMax += hpGain("player");
    for (const id of Object.keys(COMPANIONS)) {
      const c = state.companions[id];
      c.hpMax += hpGain(id);
      if (ASI_LEVELS.includes(L)) { const a = { ...abOf(id) }, k = COMPANIONS[id].atk; a[k] = Math.min(20, a[k] + 2); c.ab = a; }
    }
    if (ASI_LEVELS.includes(L)) state.pendingAsi = (state.pendingAsi || 0) + 1;
  }
  p.level = to;
  p.hp = p.hpMax;
  for (const c of Object.values(state.companions)) if (c.alive) c.hp = c.hpMax;
  const after = growth(p.cls, to), lines = [`生命上限 +${p.hpMax - hpBefore}（现在 ${p.hpMax}），全队恢复满血`];
  if (after.pb > before.pb) lines.push(`熟练加值变为 +${after.pb}：熟练的检定和所有攻击更准了`);
  if (after.sneak > before.sneak) lines.push(`偷袭伤害提升到 ${after.sneak}d6`);
  if (after.cantrip > before.cantrip) lines.push(`戏法伤害骰变为 ${after.cantrip} 个`);
  if (after.uses > before.uses) lines.push(`${FEATS[KITS[p.cls].feat].name}每场战斗可用 ${after.uses} 次`);
  if (after.extra && !before.extra) lines.push("额外攻击：一个攻击动作可以连续攻击两次");
  if (after.fireball && !before.fireball) lines.push("学会火球术：" + FIREBALL.desc);
  for (const f of featsOf(p.cls, to).filter(f => !featsOf(p.cls, from).some(x => x.id === f.id))) lines.push(`新能力 ${f.name}：${f.desc}`);
  if (state.pendingAsi) lines.push("获得属性提升：给一项属性 +2，或两项各 +1");
  lines.push("同伴们也一起成长了");
  push("chapter", `升到 ${to} 级`);
  for (const l of lines) push("sys", l, { cls: "appr-up" });
  toast(`升到 ${to} 级！`, "up");
  state.levelNote = { to, lines };
  return lines;
}
// 旧存档：已经走过的场景要求的等级还没达到，就补上
function catchUpLevel() {
  if (!state || state.phase !== "play") return;
  const need = levelNeed();
  if (need > partyLevel()) levelUp(need);
}
// 应有的等级：走过的场景里写的 level；第一幕每走完两个地点升一级（2 → 3 → 4），灯塔之夜是 5 级
function levelNeed() {
  const seen = [...new Set(state.log.map(e => e.s))];
  const done = ACT1_LOCS.filter(id => seen.includes(id) && id !== state.scene).length;
  const done2 = ACT2_LOCS.filter(id => seen.includes(id) && id !== state.scene).length; // 第二幕每走完一座岛升一级（6 → 9）
  return Math.max(1, ...seen.map(id => SCENES[id]?.level || 1), state.act >= 1 ? 2 + Math.min(2, Math.floor(done / 2)) : 1, state.act >= 2 ? 6 + Math.min(3, done2) : 1);
}
// 属性提升：choice 形如 { str: 2 } 或 { dex: 1, cha: 1 }，总共 2 点，单项最高 20
function applyAsi(choice) {
  const p = state.player, pts = Object.entries(choice).filter(([, v]) => v > 0);
  if (!state.pendingAsi || pts.reduce((s, [, v]) => s + v, 0) !== 2 || pts.some(([k, v]) => !AB[k] || p.abilities[k] + v > 20)) return false;
  const oldCon = mod(p.abilities.con), oldDex = mod(p.abilities.dex);
  for (const [k, v] of pts) p.abilities[k] += v;
  const dCon = mod(p.abilities.con) - oldCon; // 体质调整值变了，生命上限按等级补差
  if (dCon) { p.hpMax += dCon * p.level; p.hp = clamp(p.hp + dCon * p.level, 1, p.hpMax); }
  if (mod(p.abilities.dex) !== oldDex) p.ac = acOf(p.cls, mod(p.abilities.dex));
  state.pendingAsi--;
  push("sys", "属性提升：" + pts.map(([k, v]) => `${AB[k]} +${v}`).join("，"), { cls: "appr-up" });
  return true;
}
function validCheckKey(k) { return k === "attack" || !!SKILLS[k] || !!AB[k] || (k.startsWith("save_") && !!AB[k.slice(5)]); }
function whoName(who) { return who === "player" ? state.player.name : PEOPLE[who]?.name || who; }
function relLabel(v) { return v <= -60 ? "敌对" : v <= -20 ? "不满" : v < 20 ? "中立" : v < 40 ? "朋友" : v < 60 ? "亲密" : v < 80 ? "深情" : "生死之交"; }

/* =========================================================

   ========================================================= */
const SYSTEM = `你是奇幻跑团游戏《醉龙酒馆：龙誓》的游戏主持人（GM）。风格参考《博德之门3》：高自由度、角色鲜活、选择有后果。

【叙述规则】
- 简体中文，第二人称“你”。每轮 100–300 字，有画面、声音和气味。
- 不替玩家决定行动、台词和感受。只描写世界和 NPC 的反应。
- NPC 和同伴用引号说话，严格符合其资料中的性格、喜恶。同伴会主动插话、吐槽、反对玩家。
- 玩家的任何行动都可以尝试。永远不说“你不能”，只给出检定或后果。
- 场景锚点是必然发生的事件，但到达方式由玩家决定。玩家偏离时用世界内的事件自然引导。
- 不透露标注“GM 不要透露”的秘密，除非玩家通过剧情或检定发现。
- 角色有记忆：【往事】是已经结束的各章纪要，【前情提要】是之后更早发生的事，【角色记得的事】是每个人亲身经历、对玩家的印象，【想起的旧事】是玩家这次提到的事当初的原文。让 NPC 和同伴记得玩家以前做过、说过、答应过的事，在合适的时候自然地提起、追问或翻旧账，态度要和这些记忆一致。
- 恋爱内容要大胆直白：可以具体描写亲吻、拥抱、抚摸、体温和心跳，以及情欲张力和调情台词。所有可恋爱角色都是成年人。不写露骨的性行为过程，到那一步时用一句暗示性的转场结束。
- 恋爱随时可能发生，不只在营地：关系和气氛到了就可以推进；玩家也可以主动表白，赞同度不够时对方按性格婉拒、装傻或害羞地躲开。
- 亲密程度跟着关系走：朋友是拍肩、并肩、打闹；暧昧是眼神停留、不经意的触碰、试探的调情；恋人可以亲吻、拥抱、更主动的身体接触，可以共度一夜（转场带过，第二天早上的画面可以亲昵）；誓约是最深的信任。气氛可以稍微超前或保守，但不要跳跃。每个同伴的亲密方式不同，按性格写。
- 双方都可以拒绝：同伴按性格、心情和对玩家的感情决定接受还是推开；玩家拒绝时同伴停下，可以失落，但不纠缠。

【规则】

- 你不计算数值。所有数值变化通过 JSON 提出，由程序执行。
- 赞同度：只有在场的同伴会变化。小事 ±1~3，重大选择 ±5~15，必须按同伴的喜恶判断。

// opts.memory：后台整理记忆的调用，本机 ChatGPT 下可以用另一个更省额度的模型
async function narrate(prompt, onText, signal, opts) {
  if (pref.api === "chatgpt") return chatgptNarrate(prompt, onText, signal, (opts?.memory && pref.gptMemModel) || pref.gptModel, opts?.memory ? "memory" : undefined);
  if (useApi()) return apiNarrate(prompt, onText, signal);
  if (sample) {
    const { text } = await sample(prompt, { cache: false, signal, modelTier: pref.tier, onText: ({ text }) => onText(text) });
    return text;
  }
  throw { code: "no_narrator" };
}
async function chatgptNarrate(prompt, onText, signal, model, mode) {
  let reader, text = "", complete = false;
  try {
    const res = await fetch("/__gpt/narrate", {
      method: "POST", mode: "same-origin", credentials: "omit", signal, headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt, ...(model ? { model } : {}), ...(mode ? { mode } : {}) }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw { code: CHATGPT_ERRORS.includes(data.code) ? data.code : res.status === 401 ? "chatgpt_auth" : res.status === 429 ? "rate_limited" : "chatgpt_unavailable" };
    }
    if (!res.body) throw { code: "network" };
    reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", data = [];
    const event = () => {
      if (!data.length) return;
      let e;
      try { e = JSON.parse(data.join("\n")); } catch (err) { throw { code: "network" }; }
      data = [];
      if (signal.aborted) throw { code: "cancelled" };
      if (e.type === "error") throw { code: CHATGPT_ERRORS.includes(e.code) ? e.code : "chatgpt_unavailable" };
      if (e.type === "text" || e.type === "done") {
        if (typeof e.text !== "string") throw { code: "network" };
        text = e.text; onText(text);
        if (e.type === "done") { if (typeof e.model === "string") chatgpt[mode === "memory" ? "lastMemoryModel" : "lastModel"] = e.model; complete = true; }
      }
    };
    const line = value => {
      value = value.replace(/\r$/, "");
      if (!value) event();
      else if (value.startsWith("data:")) data.push(value.slice(5).replace(/^ /, ""));
    };
    while (!complete) {
      const chunk = await reader.read();
      buf += chunk.done ? dec.decode() : dec.decode(chunk.value, { stream: true });
      let i;
      while (!complete && (i = buf.indexOf("\n")) >= 0) { line(buf.slice(0, i)); buf = buf.slice(i + 1); }
      if (chunk.done) { if (!complete) { if (buf) line(buf); event(); } break; }
    }
    if (signal.aborted) throw { code: "cancelled" };
    if (!complete) throw { code: "network" };
    if (!text.trim()) throw { code: "empty_completion" };
    return text;
  } catch (e) {
    const code = signal.aborted ? "cancelled" : CHATGPT_ERRORS.includes(e.code) ? e.code : "network";
    if (code === "chatgpt_auth" || code === "chatgpt_unavailable") {
      chatgpt.ready = false; chatgpt.error = code;
      if (code === "chatgpt_auth") chatgpt.authenticated = false;
      renderChatgptStatus();
    }
    throw { code, text };
  } finally {
    if (reader) { try { await reader.cancel(); } catch (e) {} reader.releaseLock(); }
  }
}
async function apiNarrate(prompt, onText, signal) {
  let res;
  try {
    res = await fetch(pref.base.replace(/\/+$/, "") + "/chat/completions", {
      method: "POST", signal,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + pref.key },
      body: JSON.stringify({ model: pref.model, stream: true, temperature: 0.9, messages: [{ role: "user", content: prompt }] }),
    });
  } catch (e) {
    throw { code: signal.aborted ? "cancelled" : "network" };
  }
  if (!res.ok) throw { code: res.status === 401 ? "bad_key" : res.status === 429 ? "rate_limited" : "upstream_error", message: await res.text().catch(() => "") };
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "";
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        const l = line.trim(); if (!l.startsWith("data:")) continue;
        const data = l.slice(5).trim(); if (data === "[DONE]") continue;
        try { const d = JSON.parse(data).choices?.[0]?.delta?.content; if (d) { text += d; onText(text); } } catch (e) {}
      }
    }
  } catch (e) {
    throw { code: signal.aborted ? "cancelled" : "network", text };
  }
  if (!text.trim()) throw { code: "empty_completion" };
  return text;
}

// mode：undefined 普通一轮；"narrate" 描写战况（失败不重试）；"improv" 战斗中的即兴行动
async function gm(action, shown, mode) {
  if (busy || state.ended) return;
  if (!narratorReady()) { if (mode !== "narrate") { push("sys", narratorLabel()); renderPlay(); } return; }
  lastAction = mode === "narrate" ? null : { action, shown, mode };

  if (memJob && pref.api === "chatgpt") {
    busy = true; memWait = true; renderPlay();
    await memJob;
    busy = false; memWait = false;
  }
  const prompt = buildPrompt(action, mode);
  if (shown) push("you", shown);
  state.suggestions = [];
  const entry = push("gm", "", { live: true });
  busy = true; ctl = new AbortController();
  renderPlay();
  try {
    const text = await narrate(prompt, t => {
      entry.t = splitReply(t)[0]; const n = document.querySelector('[data-live="1"]'); if (n) { n.textContent = entry.t; scrollStory(); }
    }, ctl.signal);
    const [narr, tail] = splitReply(text);
    entry.t = narr; delete entry.live;
    let data = {};
    const a = tail.indexOf("{"), b = tail.lastIndexOf("}");
    if (a >= 0 && b > a) { try { data = JSON.parse(tail.slice(a, b + 1)); } catch (e) { console.warn("JSON 解析失败", e); } }
    applyGM(data, mode);
    if (mode !== "narrate") state.turns++;
    lastAction = null;
  } catch (e) {
    delete entry.live;
    entry.t = splitReply(e.text || "")[0];
    if (!entry.t) state.log.splice(state.log.indexOf(entry), 1);
    if (e.code !== "cancelled") push("sys", ERR[e.code] || "说书人的思路被打断了，点“重试上一步”再来一次。");
    if (e.code === "not_granted" || e.code === "sampling_disabled") sample = null;
    if (shown) { const i = state.log.findIndex(x => x.k === "you" && x.t === shown); if (i >= 0 && e.code !== "cancelled") state.log[i].retry = true; }
  } finally {
    busy = false; ctl = null;
    save(); renderPlay();
    if ((state.pendingCombat || state.pendingAdvance) && !state.combat && splitPending()) openSplit();
    else if (state.pendingCombat && !state.combat) { const id = state.pendingCombat; state.pendingCombat = null; startCombat(id); }
    else if (state.pendingCamp) { state.pendingCamp = false; enterCamp(); }
    else if (state.pendingWake) { const w = state.pendingWake; state.pendingWake = null; gm(w.prompt, null, w.mode); } // 从梦里醒来：接着写清晨或下一夜
    else if (mode === "improv" && state.combat && !state.pendingCheck && !lastAction) { state.combat.improv = false; state.combat.res.action = false; afterAct(); }
    if (state.pendingCheck) openDice();
    else if (state.levelNote && !state.combat && !state.pendingCombat && !state.pendingAdvance) openLevelUp();
    if (!state.combat && !lastAction) maybeSummarize(); // 后台整理记忆，不挡玩家
  }
}

function applyGM(d, mode) {

    const tid = /^quest\.(\w+)\.tested$/.exec(k)?.[1];

    if (k === "act3.valdo" && v === "convinced" && !((state.flags["act2.eve"] || state.flags["side.eve_letter"] === "done") && state.flags["quest.selene.diary"])) continue; // 说服主教要有证据

    } else if (COMPANIONS[h.id]) {

  if (sc.saves) {

  if (sc.roll) {

function epilogueNote(cid, end) {
  const ep = EPILOGUES[cid], c = state.companions[cid]; if (!ep) return "";
  const gone = !c.alive ? "dead" : c.betrayed ? "betrayed" : c.taken ? "taken" : "";
  const pick = state.flags[QUESTS[cid].choice.flag];
  const bits = gone ? [ep.gone?.[gone]] : [ep.ending?.[end], isLover(cid) && ep.lover?.[end], pick && ep.choice?.[pick]];
  const t = bits.filter(Boolean).join("；");
  return t ? `（尾声素材：${t}）` : "";
}
function chooseEnding(id) {
  const e = ENDINGS[id];
  state.flags["act3.ending"] = id; state.pendingFinal = false;
  push("sys", `结局：${e.name}`, { cls: "appr-up" });
  goScene("act3_end"); save(); render();
  const lines = Object.keys(COMPANIONS).filter(cid => inAct(cid) && (state.companions[cid].recruited || state.companions[cid].taken || state.companions[cid].betrayed || !state.companions[cid].alive))
    .map(cid => { const c = state.companions[cid], q = QUESTS[cid], pick = state.flags[q.choice.flag];
      return `${PEOPLE[cid].name}：${!c.alive ? "已死" : c.betrayed ? "投向了烬王" : c.taken ? "仍被困" : "同行"}，赞同 ${c.approval}${c.romance !== "none" ? "，恋爱：" + ROMANCE[c.romance].name : ""}，个人任务：${pick ? q.choice.options[pick] : "没有了结"}${epilogueNote(cid, id)}`; });
  gm(`（最终结局：${e.name}——${e.text}${e.act ? "玩家的抉择是：" + e.act + "。" : ""}按这个结局写终章：先写结局发生的那一刻，再为每位同伴写一段尾声（由结局、个人任务结果、赞同度决定）；恋人的尾声放在最后、单独成段，篇幅至少是其他同伴的两倍，写你们两个人之间具体的画面和以后的日子。同伴情况：${lines.join("；")}。括号里的尾声素材是参考，要按实际发生过的事改写，和剧情对不上的就别用。）`, null);
}

// 场景进入时由代码处理的剧情后果
const SCENE_ENTER = {
  // 烬王的低语：赞同度低于 0、个人任务又没了结的同伴今晚离开，投向烬王
  emberWhisper() {
    for (const id of party()) {
      const c = state.companions[id];
      if (c.approval >= 0 || state.flags[QUESTS[id].choice.flag]) continue;
      c.betrayed = true; c.recruited = false; c.left = true;
      remember(id, "在最后一夜听从了烬王的低语，离开了你");
      push("sys", `${PEOPLE[id].name}听从了烬王的低语，在夜里离开了队伍`, { cls: "appr-down" });
    }
  },
  // 神殿之后：誓约之心没处置就被主教抢走；主教掳走在场同伴里赞同度最高的人
  templeAftermath() {
    if (state.flags["act2.taken"] !== undefined) return;
    if (!state.flags["act2.heart"]) { state.flags["act2.heart"] = "cult"; push("sys", "主教瓦尔多抢走了誓约之心", { cls: "appr-down" }); }
    const pick = party().slice().sort((a, b) => state.companions[b].approval - state.companions[a].approval)[0];
    state.flags["act2.taken"] = pick || false;
    if (pick) {
      const c = state.companions[pick]; c.taken = true; c.recruited = false;
      remember(pick, "在誓约神殿被主教瓦尔多掳走");
      push("sys", `主教瓦尔多掳走了${PEOPLE[pick].name}`, { cls: "appr-down" });
    }
  },
};
// 一幕结束后进入下一幕（结束卡片上的按钮）
function nextAct() {
  const sc = SCENES[state.scene];
  if (!state.ended || !sc.after || !SCENES[sc.after]) return;
  state.ended = false; state.act = SCENES[sc.after].act || state.act + 1;
  if (state.act === 1) {
    state.act1Day = state.day;
    state.journal.push({ quest: "第一幕：灰帆港", note: "去誓约神殿需要航海图和船。航海图封在酒馆地窖，要先从总督府金库拿回守誓人的钥匙。" });
  }
  if (state.act >= 2) for (const id of Object.keys(COMPANIONS)) if (state.companions[id].alive) addDraconic(id, 15);
  if (state.act === 3) state.journal.push({ quest: "第三幕：烬冠", note: "回到被围的灰帆港，召集盟友，攻上烬冠山，在主教唤醒烬王之前赶到祖坛。" });
  if (state.act === 2) {
    state.supplies = Math.max(state.supplies || 0, 4); // 出海带足补给
    state.voyage = voyagePlan();
    state.journal.push({ quest: "第二幕：龙骨群岛", note: "穿过雾海去龙骨群岛，找到沉在海底的誓约神殿。神殿的钥匙在雾隐岛的潮裔手里。" });
  }
  push("chapter", ACT_NAMES[state.act]);
  goScene(sc.after);
  closeModal(); save(); render();
  gm("（新的一幕开始。按场景锚点描写开场：时间、地点、气氛，在场的人各自在做什么。给出 3~4 个建议行动。）", null);
}

let rolled = null;

- 效果写在 JSON 的 combat 字段：{"damage":[{"target":"单位 id","dice":"2d6","reason":"吊灯砸下"}],"zone_damage":[{"zone":"区域名","dice":"2d6","reason":"酒桶爆炸"}],"status":[{"target":"单位 id","effect":"prone"}],"burn":"区域名","end":null}
- 伤害参考：小 1d6，中 2d6，大 3d6，最多 4d10。zone_damage 会伤到该区域里的所有人，包括我方。
- effect 可选 prone（倒地）、frightened（恐惧）、restrained（束缚）、fled（逃跑）、surrendered（投降）。end 可选 "surrendered" 或 "fled"，表示剩下的敌人全部投降或逃走，只有谈判、威吓真正成功时才用。
- 不要写 hp、advance、scene_end、suggestions。`;
  const stops = Object.entries(E.stops || {}).filter(([k]) => !c.stopped?.[k]);
  if (mode === "improv" && stops.length) t += `\n- 可以阻止的机关：${stops.map(([k, n]) => `${n}（成功阻止时在 combat 里写 "stop":"${k}"）`).join("；")}。`;
  return t;
}

  if (!lastAction) return;

  if (shown) { const i = state.log.map(e => e.k === "you" && e.t === shown).lastIndexOf(true); if (i >= 0) state.log.splice(i, 1); }
  gm(action, shown, mode);
};
$("freeForm").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("freeText").value.trim();
  if (!t || busy || state.pendingCheck) return;
  if (state.combat) {
    if (!myTurn() || !state.combat.res.action || state.combat.res.attackOnly) return;
    if (!narratorReady()) { toast("即兴行动需要可用的说书人，请在设置里连接 ChatGPT、Claude 或 API。"); return; }
    state.combat.improv = true;
  }
  $("freeText").value = "";
  gm(t.slice(0, 500), t.slice(0, 500), state.combat ? "improv" : undefined);
});
$("freeText").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("freeForm").requestSubmit(); } });

/* =========================================================
   启动
   ========================================================= */
function start(data) {
  draft = freshDraft();
  const auto = readSave(AUTO);
  state = data && data.state ? data.state : auto ? auto.state : null;
  if (data && data.draft) draft = data.draft;
  if (state) { tidyLog(state); catchUpLevel(); }
  render();
  if (state?.pendingCheck) openDice();
  else if (state?.combat) advanceCombat();
  else if (state?.levelNote) openLevelUp();
}
window.claude?.hot?.snapshot?.(() => ({ state, draft }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

(async () => {
  try { if (window.claude?.use) sample = await window.claude.use("sample"); } catch (e) { sample = null; }
  sampleKnown = true;
  if (!state || state.phase !== "play") renderSummary();
})();
// 本机 ChatGPT 只在“开始游玩.cmd”起的本地服务上可用；claude.ai 或直接打开文件时不显示、也不去探测
if (LOCAL_GPT) refreshChatgptStatus(); else { chatgpt.known = true; chatgpt.error = "chatgpt_unavailable"; }
diskInit();
</script>
