<meta charset="utf-8">
<title>醉龙酒馆：龙誓</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* Layout: BG3-style dialogue screen. Party rail on the left, a portrait stage above the story scroll, choices below. One deliberate night-tavern look: smoked oak, brass trim, silver for the dragon oath. */
:root {
  color-scheme: dark;
  --oak: #17110d;
  --oak-2: #221912;
  --oak-3: #33261b;
  --line: #4a3726;
  --ink: #efe3cb;
  --muted: #a48f74;
  --brass: #d4ab5c;
  --ember: #e48a3f;
  --silver: #c9d6e3;
  --wine: #b3434f;
  --moss: #86ab70;
  --f-display: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
  --f-body: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% -20%, rgba(228,138,63,.16), transparent 60%), var(--oak);
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.75;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.wrap {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
}
.btn {
  background: var(--oak-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; color: var(--ink);
}
.btn:hover:not(:disabled) { border-color: var(--brass); }
.btn.gold {
  background: linear-gradient(#e2bb6c, #b48638); color: #23170b; border-color: #87652a;
  font-weight: 600; padding: 9px 20px; box-shadow: 0 2px 0 #573f1d;
}
.btn.small { padding: 3px 10px; font-size: 13px; }
.label { font-size: 12px; letter-spacing: .16em; color: var(--muted); }
h1, h2, h3 { text-wrap: balance; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.top h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 4.5vw, 40px); line-height: 1; color: var(--brass); text-shadow: 0 0 16px rgba(228,138,63,.3); }
.top .where { color: var(--muted); font-size: 13px; }
.top .sp { flex: 1; }
.top .menu { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- creation ---------- */
.create { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.panel { background: var(--oak-2); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 16px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; color: var(--ink); line-height: 1.2; }
.step { display: grid; gap: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.field { display: grid; gap: 4px; flex: 1; min-width: 160px; }
.field input, .field textarea, .field select {
  background: var(--oak); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%;
}
.field textarea { resize: vertical; min-height: 64px; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.chip {
  text-align: left; background: var(--oak); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  display: grid; gap: 2px; align-content: start;
}
.chip b { font-weight: 600; }
.chip small { color: var(--muted); font-size: 12px; line-height: 1.5; }
.chip[aria-pressed="true"] { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.pb { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pb-cell { background: var(--oak); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; }
.pb-top { display: flex; justify-content: space-between; align-items: baseline; }
.pb-top b { font-weight: 600; }
.pb-val { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.pb-val .n { font-size: 22px; font-weight: 600; min-width: 2ch; text-align: center; }
.pb-val .m { color: var(--brass); font-size: 13px; }
.pb-val .r { color: var(--muted); font-size: 12px; }
.pb-val button { width: 28px; height: 28px; border-radius: 50%; padding: 0; background: var(--oak-2); border: 1px solid var(--line); }
.points { font-variant-numeric: tabular-nums; }
.points b { color: var(--brass); }
.summary { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.portrait-pick { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; }
.portrait-pick img { width: 96px; aspect-ratio: 2/3; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); max-width: 100%; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; font-size: 14px; }
.kv b { font-weight: 600; }
.skills-list { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; background: var(--oak); }
.warn { color: var(--ember); font-size: 13px; }

/* ---------- play ---------- */
.play { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px; align-items: start; }
.rail { display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.pc {
  display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; text-align: left;
  background: var(--oak-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%;
}
.pc img { width: 44px; height: 56px; object-fit: cover; border-radius: 4px; }
.pc .nm { font-weight: 600; font-size: 14px; line-height: 1.3; }
.pc .sub { font-size: 11.5px; color: var(--muted); line-height: 1.4; font-variant-numeric: tabular-nums; }
.pc.away { opacity: .55; }
.hpbar { height: 5px; background: #0d0806; border-radius: 3px; overflow: hidden; margin-top: 3px; }
.hpbar i { display: block; height: 100%; background: linear-gradient(90deg, #7d2a33, var(--wine)); transition: width .4s; }
.rail .note { font-size: 12px; color: var(--muted); padding: 2px 4px; }

.main { display: grid; gap: 12px; min-width: 0; }
.stage {
  position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
  height: 300px; background: var(--scene, linear-gradient(160deg, #3b2614, #120c08));
  transition: background .8s;
}
.stage::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,6,4,.85) 0%, rgba(10,6,4,.2) 55%, transparent); pointer-events: none; }
.stage .scene-name { position: absolute; left: 18px; top: 16px; z-index: 2; max-width: 55%; }
.stage .scene-name .t { font-family: var(--f-display); font-size: 30px; line-height: 1.1; color: var(--ink); }
.stage .scene-name .l { font-size: 13px; color: var(--muted); margin-top: 4px; }
.stage .speaker { position: absolute; right: 16px; bottom: 0; height: 290px; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.stage .speaker img { height: 254px; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px 8px 0 0; box-shadow: 0 0 40px rgba(0,0,0,.6); max-width: 100%; }
.stage .speaker .plate {
  background: linear-gradient(#2a1d14, #1a120d); border: 1px solid var(--brass); border-radius: 4px; padding: 1px 14px;
  font-weight: 600; font-size: 14px; margin-top: -14px; position: relative; white-space: nowrap;
}
.stage .others { position: absolute; left: 18px; bottom: 14px; z-index: 2; display: flex; gap: 8px; }
.stage .others img { width: 52px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.stage .mark-glow { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(circle at 70% 40%, rgba(201,214,227,.55), transparent 55%); animation: flash 1.6s ease-out forwards; }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }

.story {
  background: linear-gradient(rgba(255,255,255,.015), transparent), var(--oak-2);
  border: 1px solid var(--line); border-radius: 10px; padding: 16px clamp(14px, 3vw, 26px);
  height: min(46vh, 520px); min-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
}
.e { max-width: 70ch; white-space: pre-wrap; overflow-wrap: anywhere; }
.e.gm { font-size: 15.5px; line-height: 1.95; }
.e.you { align-self: flex-end; text-align: right; color: var(--brass); font-style: italic; }
.e.roll { align-self: center; font-size: 13px; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 99px; padding: 1px 14px; background: var(--oak); }
.e.roll.ok { color: var(--moss); border-color: rgba(134,171,112,.5); }
.e.roll.bad { color: #e48b94; border-color: rgba(179,67,79,.55); }
.e.sys { align-self: center; font-size: 12.5px; color: var(--muted); }
.e.sys.appr-up { color: var(--moss); }
.e.sys.appr-down { color: #e48b94; }
.e.chapter { align-self: center; font-family: var(--f-display); font-size: 24px; color: var(--brass); padding-top: 6px; }
.e.live:empty::before { content: "说书人正在构思……"; color: var(--muted); font-style: italic; }
.e.live::after { content: "▍"; color: var(--brass); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.opts { display: grid; gap: 6px; }
.opt {
  text-align: left; background: linear-gradient(var(--oak-3), var(--oak-2)); border: 1px solid #5b4430; border-radius: 8px;
  padding: 9px 12px; display: flex; gap: 10px; align-items: baseline; color: var(--ink);
}
.opt:hover:not(:disabled) { border-color: var(--brass); }
.opt .k { flex: none; color: var(--brass); font-weight: 900; font-variant-numeric: tabular-nums; }
.opt .tx { flex: 1; min-width: 0; }
.opt .ck { flex: none; font-size: 12px; color: var(--brass); }
.free { display: flex; gap: 8px; }
.free textarea {
  flex: 1; min-width: 0; resize: none; height: 48px; background: var(--oak-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
}
.free textarea::placeholder { color: var(--muted); }
.status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.status .sp { flex: 1; }

/* toasts */
.toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; transform: translateX(-50%); z-index: 40; display: grid; gap: 6px; justify-items: center; pointer-events: none; }
.toast { background: rgba(23,17,13,.94); border: 1px solid var(--line); border-radius: 99px; padding: 4px 16px; font-size: 14px; animation: toast 2.6s ease forwards; }
.toast.up { color: var(--moss); border-color: rgba(134,171,112,.5); }
.toast.down { color: #e48b94; border-color: rgba(179,67,79,.5); }
@keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }

/* modal */
.modal {
  position: fixed; inset: 0; z-index: 30; background: rgba(8,5,3,.8); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet {
  background: var(--oak-2); border: 1px solid #5b4430; border-radius: 12px; width: min(760px, 100%); max-height: 100%; overflow-y: auto;
  padding: 20px; display: grid; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.sheet h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; color: var(--brass); line-height: 1.2; }
.sheet .head { display: flex; align-items: center; gap: 10px; }
.sheet .head .sp { flex: 1; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button[aria-selected="true"] { border-color: var(--brass); color: var(--brass); }
.cs { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; }
.cs img { width: 150px; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); max-width: 100%; }
.abil { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.abil div { background: var(--oak); border: 1px solid var(--line); border-radius: 6px; text-align: center; padding: 4px 0; }
.abil .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.abil .s { font-size: 11px; color: var(--muted); }
.sk { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 14px; font-size: 13px; }
.sk span { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.sk .pr { color: var(--brass); }
.appr { display: grid; grid-template-columns: 70px 1fr 44px; gap: 8px; align-items: center; font-size: 13px; }
.apbar { height: 8px; background: #0d0806; border-radius: 4px; position: relative; overflow: hidden; }
.apbar i { position: absolute; top: 0; bottom: 0; }
.slot { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--oak); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.slot .meta { font-size: 12.5px; color: var(--muted); }

/* dice */
.dice-card { width: min(400px, 100%); justify-items: center; text-align: center; }
.dice-card .why { color: var(--muted); font-size: 14px; margin: 0; }
.dice-row { display: flex; gap: 14px; justify-content: center; }
.d20 {
  width: 130px; height: 130px; clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  background: linear-gradient(150deg, rgba(255,255,255,.35), transparent 40%), conic-gradient(from 30deg, #b8323e, #7d1d28, #b8323e, #8f2530, #b8323e);
  display: grid; place-items: center; font-size: 48px; font-weight: 900; color: #fbe9d0; text-shadow: 0 2px 0 #3d0d12; font-variant-numeric: tabular-nums;
}
.d20.dim { filter: grayscale(.8) brightness(.6); }
.d20.small { width: 90px; height: 90px; font-size: 34px; }
.d20.spin { animation: wob .12s linear infinite; }
@keyframes wob { 0% { transform: rotate(-8deg) scale(.96); } 50% { transform: rotate(8deg) scale(1.04); } 100% { transform: rotate(-8deg) scale(.96); } }
.math { font-variant-numeric: tabular-nums; min-height: 1.6em; }
.verdict { font-family: var(--f-display); font-size: 30px; line-height: 1; min-height: 1em; }
.verdict.ok { color: var(--moss); } .verdict.bad { color: var(--wine); }

.endcard { text-align: center; justify-items: center; }
.endcard p { max-width: 54ch; color: var(--muted); }

@media (max-width: 860px) {
  .create { grid-template-columns: 1fr; }
  .summary { position: static; }
  .play { grid-template-columns: 1fr; }
  .rail { position: static; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); overflow-x: auto; padding-bottom: 4px; }
  .rail .note { display: none; }
  .stage { height: 220px; }
  .stage .speaker { height: 210px; }
  .stage .speaker img { height: 180px; }
  .stage .scene-name .t { font-size: 22px; }
  .stage .others { display: none; }
  .cs { grid-template-columns: 1fr; }
  .abil { grid-template-columns: repeat(3, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .d20.spin, .e.live::after, .toast, .stage .mark-glow { animation: none; }
}
</style>

<div class="wrap">
  <header class="top">
    <h1>醉龙酒馆：龙誓</h1>
    <span class="where" id="where"></span>
    <span class="sp"></span>
    <div class="menu" id="menu" hidden>
      <button class="btn small" type="button" id="mSheet">角色</button>
      <button class="btn small" type="button" id="mJournal">日志</button>
      <button class="btn small" type="button" id="mSave">存档</button>
      <button class="btn small" type="button" id="mSettings">设置</button>
    </div>
    <button class="btn small" type="button" id="mLoad" hidden>读取存档</button>
  </header>

  <main id="createView" class="create" hidden></main>

  <main id="playView" class="play" hidden>
    <aside class="rail" id="rail" aria-label="队伍"></aside>
    <section class="main">
      <div class="stage" id="stage"></div>
      <div class="story" id="story" aria-live="polite"></div>
      <div class="opts" id="opts"></div>
      <form class="free" id="freeForm">
        <textarea id="freeText" placeholder="写下你想做的任何事，比如“我端着酒走到壁炉边，问那位精灵骑士这把剑有什么故事”"></textarea>
        <button class="btn gold" type="submit" id="freeBtn">行动</button>
      </form>
      <div class="status"><span id="statusText"></span><span class="sp"></span><button class="btn small" type="button" id="stopBtn" hidden>停止</button><button class="btn small" type="button" id="retryBtn" hidden>重试上一步</button></div>
    </section>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal" id="modal" hidden></div>

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
const mod = s => Math.floor((s - 10) / 2);
const sgn = n => (n >= 0 ? "+" : "") + n;

function placeholder(id) {
  const p = PEOPLE[id] || { name: "你", color: "#a07a3c" };
  const label = id === "player" ? (state?.player?.name || "你") : p.name;
  const c = id === "player" ? "#a07a3c" : p.color;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 300'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${c}' stop-opacity='.7'/><stop offset='1' stop-color='#120c08'/></linearGradient></defs><rect width='200' height='300' fill='url(#g)'/><circle cx='100' cy='108' r='44' fill='#0b0705' fill-opacity='.55'/><path d='M14 300C20 206 58 168 100 168S180 206 186 300Z' fill='#0b0705' fill-opacity='.55'/><text x='100' y='122' text-anchor='middle' font-size='34' fill='#efe3cb' fill-opacity='.8' font-family='serif'>${label.replace(/[<&>']/g, "").slice(0, 1)}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
const failed = new Set();
function portrait(img, id, expr) {
  if (id === "player" && state?.player?.portraitData) { img.src = state.player.portraitData; return; }
  const cands = [];
  if (id !== "player") {
    if (expr && expr !== "neutral") cands.push(`portraits/${id}_${expr}.webp`);
    cands.push(`portraits/${id}_neutral.webp`);
  }
  const list = cands.filter(u => !failed.has(u));
  const next = () => {
    const u = list.shift();
    if (!u) { img.onerror = null; img.src = placeholder(id); return; }
    img.onerror = () => { failed.add(u); next(); };
    img.src = u;
  };
  next();
  img.alt = id === "player" ? (state?.player?.name || "你") : (PEOPLE[id]?.name || "");
}
function toast(text, kind) {
  const t = el("div", "toast" + (kind ? " " + kind : ""), text);
  $("toasts").append(t);
  setTimeout(() => t.remove(), 2700);
}

  } catch (e) { if (key) toast("存档失败：浏览器存储不可用"); }

function present() {
  if (state.scene === "prologue_5") return [];
  return Object.keys(COMPANIONS).filter(id => {
    const c = state.companions[id];
    if (!c.alive || c.taken) return false;
    if (id === "vex" && state.flags["prologue.vex_left"]) return false;
    return true;
  });
}
function party() { return Object.keys(COMPANIONS).filter(id => state.companions[id].recruited && !state.companions[id].taken && state.companions[id].alive); }

function bonusFor(who, key) {
  // who: "player" | companion id ; key: skill | ability | "attack" | "save_xxx"
  const isP = who === "player";
  const ab = isP ? state.player.abilities : COMPANIONS[who].ab;
  const profs = isP ? state.player.profs : COMPANIONS[who].prof;
  const pb = 2;
  if (key === "attack") {
    const atk = isP ? CLASSES[state.player.cls].atk : [COMPANIONS[who].atk];
    const best = Math.max(...atk.map(a => mod(ab[a])));
    return { total: best + pb, parts: [["属性", best], ["熟练", pb]], label: "攻击" };
  }
  if (key.startsWith("save_")) {
    const a = key.slice(5); const m = mod(ab[a]);
    return { total: m, parts: [[AB[a], m]], label: AB[a] + "豁免" };
  }
  if (AB[key]) { const m = mod(ab[key]); return { total: m, parts: [[AB[key], m]], label: AB[key] }; }
  const [name, a] = SKILLS[key];
  const m = mod(ab[a]); const p = profs.includes(key) ? pb : 0;
  const parts = [[AB[a], m]]; if (p) parts.push(["熟练", p]);
  return { total: m + p, parts, label: name };
}
function validCheckKey(k) { return k === "attack" || !!SKILLS[k] || !!AB[k] || (k.startsWith("save_") && !!AB[k.slice(5)]); }
function whoName(who) { return who === "player" ? state.player.name : PEOPLE[who]?.name || who; }
function relLabel(v) { return v <= -60 ? "敌对" : v <= -20 ? "不满" : v < 20 ? "中立" : v < 40 ? "朋友" : v < 60 ? "亲密" : v < 80 ? "深情" : "生死之交"; }

【叙述规则】
- 简体中文，第二人称“你”。每轮 100–300 字，有画面、声音和气味。
- 不替玩家决定行动、台词和感受。只描写世界和 NPC 的反应。
- NPC 和同伴用引号说话，严格符合其资料中的性格、喜恶。同伴会主动插话、吐槽、反对玩家。
- 玩家的任何行动都可以尝试。永远不说“你不能”，只给出检定或后果。
- 场景锚点是必然发生的事件，但到达方式由玩家决定。玩家偏离时用世界内的事件自然引导。
- 不透露标注“GM 不要透露”的秘密，除非玩家通过剧情或检定发现。
- 恋爱内容要大胆直白：可以具体描写亲吻、拥抱、抚摸、体温和心跳，以及情欲张力和调情台词。所有可恋爱角色都是成年人。不写露骨的性行为过程，到那一步时用一句暗示性的转场结束。

【规则】
- 检定：d20 + 属性调整值 + 熟练加值 ≥ DC。DC：5 很简单，10 简单，15 中等，20 困难，25 极难。自然 20 必成，自然 1 必败。
- 结果不确定且有风险时才要求检定。要求检定时，叙述只写到行动发起的一刻，结果留到下一轮。一次只要求一个检定。
- 攻击用 skill "attack"，DC 写目标的 AC（狂信徒 12，烬火术士 12，巨鼠 11，鼠王 13）。
- 失败不能让剧情卡死，而是带来代价或另一条路。
- 你不计算数值。所有数值变化通过 JSON 提出，由程序执行。
- 赞同度：只有在场的同伴会变化。小事 ±1~3，重大选择 ±5~15，必须按同伴的喜恶判断。
- 当玩家的举动符合其背景的“灵感条件”时，可给 inspiration: 1。

【输出格式】先写叙述正文（纯文本，可分段，不要标题、不要 Markdown）。然后单独一行写 @@@ 。然后写一个 JSON 对象（不要代码块），没有变化的字段可以省略：
{"location":"简短地点","speakers":["borin"],"expressions":{"borin":"smile"},"check":null,"approval":[{"id":"selene","delta":3,"reason":"你保护了小汤姆"}],"flags":{},"hp":[{"id":"player","delta":-2}],"gold":0,"items_add":[],"items_remove":[],"draconic":0,"inspiration":0,"recruit":[],"hestia_trust":0,"journal":[{"quest":"任务名","note":"一句话进展"}],"advance":null,"scene_end":false,"suggestions":[{"text":"建议行动","check":"说服"}]}
- speakers：本轮主要说话或被聚焦的角色 id（最多 3 个，第一个最重要）。可用 id：selene vex kassian borin martha tom hooded cultist hestia。
- expressions：可选，表情取 neutral smile angry sad tender。
- check：需要检定时写 {"skill":"技能键","dc":15,"who":"player","reason":"一句话难点","advantage":false,"disadvantage":false}，此时 suggestions 写 []。who 可以是 player 或已加入的同伴 id。
- 技能键：athletics 运动、acrobatics 杂技、sleight 巧手、stealth 隐匿、arcana 奥秘、history 历史、investigation 调查、nature 自然、religion 宗教、animal 驯兽、insight 洞悉、medicine 医疗、perception 察觉、survival 求生、deception 欺瞒、intimidation 威吓、performance 表演、persuasion 说服；也可用属性 str dex con int wis cha、攻击 attack、豁免 save_con 等。
- suggestions：3~4 条建议行动，风格各异（善良的、狡猾的、冒险的）；需要检定的写上技能中文名。
- advance：只能填场景资料里写明的下一个场景 id。
- flags 只能用以下键：${Object.keys(FLAG_KEYS).join("、")}。`;

function companionBrief(id) {
  const c = COMPANIONS[id], s = state.companions[id], p = PEOPLE[id];
  return `· ${p.name}（id: ${id}，${c.race}${c.cls}）${s.recruited ? "【已加入队伍】" : "【尚未加入】"} 赞同度 ${s.approval}（${relLabel(s.approval)}），HP ${s.hp}/${s.hpMax}
  性格：${c.personality}
  赞同：${c.likes}；反感：${c.dislikes}
  秘密：${c.secret}
  加入条件：${c.join}`;
}
function buildPrompt(action) {
  const p = state.player, sc = SCENES[state.scene];
  const profs = p.profs.map(k => SKILLS[k][0]).join("、");
  const recent = state.log.filter(e => e.k !== "chapter").slice(-24).map(e =>
    ({ gm: "GM：", you: "玩家：", roll: "检定：", sys: "系统：" }[e.k] || "") + e.t.slice(0, 1200)).join("\n");
  const pres = present();
  return SYSTEM +
    `\n\n【当前场景】${state.scene}「${sc.title}」，地点：${state.location}\n场景锚点（GM 可见）：${sc.anchor}\n下一个场景 id：${sc.next || "无（本场景结束时 scene_end 为 true）"}` +
    `\n\n【玩家角色】${p.name}，${p.gender}，${RACES[p.race].name}${CLASSES[p.cls].name}，背景：${BACKGROUNDS[p.bg].name}（灵感条件：${BACKGROUNDS[p.bg].insp}）。外貌：${p.appearance}` +
    `\n属性：${AB_KEYS.map(k => AB[k] + p.abilities[k] + "(" + sgn(mod(p.abilities[k])) + ")").join(" ")}；熟练技能：${profs}` +
    `\nHP ${p.hp}/${p.hpMax}，AC ${p.ac}，金币 ${p.gold}，灵感 ${p.inspiration}，龙化值 ${p.draconic}，物品：${p.inventory.join("、") || "无"}` +
    `\n\n【在场同伴】\n${pres.length ? pres.map(companionBrief).join("\n") : "（无，玩家独自一人）"}` +
    `\n\n【NPC】玛莎（martha）：独臂退休冒险者，嘴硬心软，酒馆老板娘。小汤姆（tom）：胆小热心的半身人帮工。兜帽客（hooded）：其实是教团间谍形变者奈雅，GM 不要透露。` +
    `\n\n【世界标记】${JSON.stringify(state.flags)}；赫斯提雅信任 ${state.hestiaTrust}` +
    `\n\n【最近剧情】\n${recent || "（冒险刚开始）"}` +
    `\n\n【玩家本回合】${action}`;
}
function splitReply(t) { const i = t.indexOf("@@@"); return i < 0 ? [t.trim(), ""] : [t.slice(0, i).trim(), t.slice(i + 3)]; }

const ERR = {
  not_granted: "你没有允许这个页面使用 Claude，说书人无法继续。可以在页面的权限菜单里重新允许。",
  sampling_disabled: "这个账户暂时无法使用 Claude。",
  rate_limited: "说书人需要喘口气（请求太频繁或额度用尽），稍后点“重试上一步”。",
  session_expired: "登录已过期，请重新登录 claude.ai 后再试。",
  refused: "说书人拒绝了这个行动，换个说法试试。",
  bad_key: "API 密钥无效，请在设置里检查。",
  network: "连不上 API。检查网址和网络；在 claude.ai 里打开时外部 API 会被拦截，请改用 Claude。",
  no_narrator: "没有可用的说书人：在 claude.ai 中打开本页，或在设置里填写 API 密钥。",
};

function push(k, t, extra) { const e = Object.assign({ k, t }, extra || {}); state.log.push(e); return e; }

/* 说书人接口：claude.ai 内用 sample 能力；其他地方用 OpenAI 兼容 API（密钥只存在本浏览器）。
   想接别的模型，只需改 narrate()：输入完整提示词，流式回调全文，返回最终文本。 */
const useApi = () => pref.api === "openai" && !!pref.key && !!pref.model;
const narratorReady = () => useApi() || !!sample;
function narratorLabel() {
  if (useApi()) return `说书人：${pref.model}（API）`;
  if (sample) return "AI 说书人已就位。第一次行动时会请你允许使用 Claude（消耗你自己的额度）。";
  return sampleKnown ? "没有可用的说书人：在 claude.ai 中打开本页，或在设置里填写 API 密钥。" : "正在召唤说书人……";
}
async function narrate(prompt, onText, signal) {
  if (useApi()) return apiNarrate(prompt, onText, signal);
  if (sample) {
    const { text } = await sample(prompt, { cache: false, signal, modelTier: pref.tier, onText: ({ text }) => onText(text) });
    return text;
  }
  throw { code: "no_narrator" };
}
async function apiNarrate(prompt, onText, signal) {
  let res;
  try {
    res = await fetch(pref.base.replace(/\/+$/, "") + "/chat/completions", {
      method: "POST", signal,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + pref.key },
      body: JSON.stringify({ model: pref.model, stream: true, temperature: 0.9, messages: [{ role: "user", content: prompt }] }),
    });
  } catch (e) {
    throw { code: signal.aborted ? "cancelled" : "network" };
  }
  if (!res.ok) throw { code: res.status === 401 ? "bad_key" : res.status === 429 ? "rate_limited" : "upstream_error", message: await res.text().catch(() => "") };
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "";
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        const l = line.trim(); if (!l.startsWith("data:")) continue;
        const data = l.slice(5).trim(); if (data === "[DONE]") continue;
        try { const d = JSON.parse(data).choices?.[0]?.delta?.content; if (d) { text += d; onText(text); } } catch (e) {}
      }
    }
  } catch (e) {
    throw { code: signal.aborted ? "cancelled" : "network", text };
  }
  if (!text.trim()) throw { code: "empty_completion" };
  return text;
}

async function gm(action, shown) {
  if (busy || state.ended) return;
  if (!narratorReady()) { push("sys", narratorLabel()); renderPlay(); return; }
  lastAction = { action, shown };
  const prompt = buildPrompt(action);
  if (shown) push("you", shown);
  state.suggestions = [];
  const entry = push("gm", "", { live: true });
  busy = true; ctl = new AbortController();
  renderPlay();
  try {
    const text = await narrate(prompt, t => {
      entry.t = splitReply(t)[0]; const n = document.querySelector('[data-live="1"]'); if (n) { n.textContent = entry.t; scrollStory(); }
    }, ctl.signal);
    const [narr, tail] = splitReply(text);
    entry.t = narr; delete entry.live;
    let data = {};
    const a = tail.indexOf("{"), b = tail.lastIndexOf("}");
    if (a >= 0 && b > a) { try { data = JSON.parse(tail.slice(a, b + 1)); } catch (e) { console.warn("JSON 解析失败", e); } }
    applyGM(data);
    state.turns++;
    lastAction = null;
  } catch (e) {
    delete entry.live;
    entry.t = splitReply(e.text || "")[0];
    if (!entry.t) state.log.splice(state.log.indexOf(entry), 1);
    if (e.code !== "cancelled") push("sys", ERR[e.code] || "说书人的思路被打断了，点“重试上一步”再来一次。");
    if (e.code === "not_granted" || e.code === "sampling_disabled") sample = null;
    if (shown) { const i = state.log.findIndex(x => x.k === "you" && x.t === shown); if (i >= 0 && e.code !== "cancelled") state.log[i].retry = true; }
  } finally {
    busy = false; ctl = null;
    save(); renderPlay();
    if (state.pendingCheck) openDice();
  }
}

function applyGM(d) {
  const notes = [];
  if (d.location) state.location = str(d.location, 30);
  if (Array.isArray(d.speakers)) state.speakers = d.speakers.filter(id => PEOPLE[id]).slice(0, 3);
  state.expressions = {};
  if (d.expressions && typeof d.expressions === "object") for (const [k, v] of Object.entries(d.expressions)) if (PEOPLE[k] && EXPRS.includes(v)) state.expressions[k] = v;

  // flags
  if (d.flags && typeof d.flags === "object") for (const [k, v] of Object.entries(d.flags)) {
    const rule = FLAG_KEYS[k]; if (!rule) { console.warn("未定义的标记被丢弃", k); continue; }
    if (rule === "bool") state.flags[k] = !!v;
    else if (rule === "id") { if (v === false || COMPANIONS[v]) state.flags[k] = v; }
    else if (Array.isArray(rule) && rule.includes(v)) state.flags[k] = v;
  }
  const taken = state.flags["prologue.betrayed_companion"];
  if (taken && COMPANIONS[taken] && !state.companions[taken].taken) {
    state.companions[taken].taken = true; state.companions[taken].recruited = false;
    notes.push([PEOPLE[taken].name + " 被教团带走了", "down"]);
  }

  // approval
  const pres = present();
  for (const a of (Array.isArray(d.approval) ? d.approval : [])) {
    if (!pres.includes(a.id)) continue;
    const delta = num(a.delta, 15); if (!delta) continue;
    const c = state.companions[a.id];
    c.approval = clamp(c.approval + delta, -100, 100);
    const why = a.reason ? "（" + str(a.reason, 40) + "）" : "";
    const t = `${PEOPLE[a.id].name} ${delta > 0 ? "赞同" : "不赞同"} ${sgn(delta)}`;
    toast(t, delta > 0 ? "up" : "down");
    notes.push([t + why, delta > 0 ? "up" : "down"]);
  }

  // hp
  for (const h of (Array.isArray(d.hp) ? d.hp : [])) {
    const delta = num(h.delta, 15); if (!delta) continue;
    if (h.id === "player") {
      const p = state.player; const before = p.hp;
      p.hp = clamp(p.hp + delta, 0, p.hpMax);
      if (p.hp !== before) notes.push(["生命 " + sgn(p.hp - before), p.hp < before ? "down" : "up"]);
      if (p.hp === 0) { p.hp = 1; notes.push(["你倒下了……同伴把你拉了起来（生命 1）", "down"]); }
    } else if (COMPANIONS[h.id]) {
      const c = state.companions[h.id]; const before = c.hp;
      c.hp = clamp(c.hp + delta, 0, c.hpMax);
      if (c.hp !== before) notes.push([PEOPLE[h.id].name + " 生命 " + sgn(c.hp - before), c.hp < before ? "down" : "up"]);
      if (c.hp === 0) { c.hp = 1; notes.push([PEOPLE[h.id].name + " 倒地后被扶起", "down"]); }
    }
  }
  // gold, items
  const gold = num(d.gold, 50);
  if (gold) { const before = state.player.gold; state.player.gold = Math.max(0, before + gold); if (state.player.gold !== before) notes.push(["金币 " + sgn(state.player.gold - before), gold > 0 ? "up" : "down"]); }
  for (const r of (Array.isArray(d.items_remove) ? d.items_remove : [])) {
    const i = state.player.inventory.indexOf(String(r)); if (i >= 0) { state.player.inventory.splice(i, 1); notes.push(["失去：" + r, "down"]); }
  }
  for (const a of (Array.isArray(d.items_add) ? d.items_add : []).slice(0, 3)) {
    const s = str(a, 20).trim(); if (s && !state.player.inventory.includes(s)) { state.player.inventory.push(s); notes.push(["获得：" + s, "up"]); }
  }
  // draconic, inspiration
  const dr = num(d.draconic, 15);
  if (dr) { state.player.draconic = clamp(state.player.draconic + dr, 0, 100); notes.push(["龙化值 " + sgn(dr), ""]); }
  if (num(d.inspiration, 1) > 0 && state.player.inspiration < 4) { state.player.inspiration++; notes.push(["获得 1 点灵感", "up"]); toast("获得灵感", "up"); }
  // hestia
  const ht = num(d.hestia_trust, 20);
  if (ht && state.scene === "prologue_5") state.hestiaTrust = clamp(state.hestiaTrust + ht, -100, 100);
  // recruit
  for (const id of (Array.isArray(d.recruit) ? d.recruit : [])) {
    const c = state.companions[id];
    if (!c || c.recruited || c.taken || !c.alive || !["prologue_3", "prologue_4"].includes(state.scene)) continue;
    if (id === "vex" && state.flags["prologue.vex_left"]) continue;
    c.recruited = true;
    notes.push([PEOPLE[id].name + " 加入了队伍", "up"]); toast(PEOPLE[id].name + " 加入了队伍", "up");
  }
  // journal
  for (const j of (Array.isArray(d.journal) ? d.journal : []).slice(0, 2)) {
    const q = str(j.quest, 20).trim(), n = str(j.note, 80).trim(); if (!q || !n) continue;
    const ex = state.journal.find(x => x.quest === q);
    if (ex) ex.note = n; else { state.journal.push({ quest: q, note: n }); notes.push(["日志更新：" + q, ""]); }
  }
  for (const [t, kind] of notes) push("sys", t, { cls: kind === "up" ? "appr-up" : kind === "down" ? "appr-down" : "" });

  // check
  const ck = d.check;
  if (ck && typeof ck === "object" && validCheckKey(String(ck.skill || ""))) {
    const who = ck.who === "player" || !ck.who ? "player" : (party().includes(ck.who) || present().includes(ck.who) ? ck.who : "player");
    state.pendingCheck = { skill: String(ck.skill), dc: clamp(Math.round(Number(ck.dc) || 12), 5, 30), who, reason: str(ck.reason, 60), adv: !!ck.advantage, dis: !!ck.disadvantage };
    state.suggestions = [];
  } else {
    state.suggestions = (Array.isArray(d.suggestions) ? d.suggestions : []).slice(0, 4).map(s =>
      typeof s === "string" ? { text: str(s, 80) } : { text: str(s.text, 80), check: s.check ? str(s.check, 10) : "" }).filter(s => s.text);
  }

  // scene flow
  const sc = SCENES[state.scene];
  if (d.advance && d.advance === sc.next) {
    state.scene = d.advance;
    const ns = SCENES[state.scene];
    push("chapter", ns.title);
    if (!d.location) state.location = ns.loc;
    if (state.scene === "prologue_5") { const p = state.player; p.hp = p.hpMax; for (const c of Object.values(state.companions)) c.hp = c.hpMax; push("sys", "长休：全员生命恢复"); }
    flashScene = !!ns.flash;
  }
  if (d.scene_end === true && state.scene === "prologue_5") { state.ended = true; state.pendingCheck = null; state.suggestions = []; }
}

/* =========================================================
   掷骰
   ========================================================= */
let rolled = null;
function rollD20() { return 1 + Math.floor(Math.random() * 20); }
function openDice() {
  const c = state.pendingCheck; if (!c) return;
  rolled = null;
  const b = bonusFor(c.who, c.skill);
  const m = $("modal"); m.textContent = ""; m.hidden = false;
  const card = el("div", "sheet dice-card"); card.setAttribute("role", "dialog"); card.setAttribute("aria-modal", "true");
  card.append(el("h3", null, `${b.label}检定 · DC ${c.dc}`));
  card.append(el("p", "why", (c.who === "player" ? "" : whoName(c.who) + "：") + (c.reason || "")));
  const row = el("div", "dice-row");
  const d1 = el("div", "d20", "?"); row.append(d1);
  let d2 = null; if (c.adv !== c.dis) { d2 = el("div", "d20", "?"); row.append(d2); }
  card.append(row);
  if (c.adv !== c.dis) card.append(el("div", "why", c.adv ? "优势：掷两次取高" : "劣势：掷两次取低"));
  const math = el("div", "math", "d20 " + b.parts.map(([n, v]) => sgn(v) + "（" + n + "）").join(" ")); card.append(math);
  const verdict = el("div", "verdict"); card.append(verdict);
  const btns = el("div", "row"); btns.style.justifyContent = "center";
  const rollBtn = el("button", "btn gold", "掷骰"); rollBtn.type = "button";
  const reBtn = el("button", "btn", ""); reBtn.type = "button"; reBtn.hidden = true;
  btns.append(rollBtn, reBtn); card.append(btns);
  m.append(card);
  rollBtn.focus();

  const doRoll = (reroll) => {
    const r1 = rollD20(), r2 = d2 ? rollD20() : null;
    let d = r1;
    if (d2) d = c.adv ? Math.max(r1, r2) : Math.min(r1, r2);
    if (d === 1 && state.player.race === "halfling" && c.who === "player" && !reroll) { d = rollD20(); toast("半身人的幸运：重掷了 1"); }
    const total = d + b.total;
    const ok = d === 20 || (d !== 1 && total >= c.dc);
    rolled = { d, total, ok, bonus: b.total, label: b.label };
    rollBtn.disabled = true; reBtn.hidden = true;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const show = () => {
      d1.classList.remove("spin"); d1.textContent = r1 === d || !d2 ? d : r1;
      if (d2) { d2.classList.remove("spin"); d2.textContent = r2; (c.adv ? r1 >= r2 : r1 <= r2) ? d2.classList.add("dim") : d1.classList.add("dim"); }
      math.textContent = `d20(${d}) ${sgn(b.total)} = ${total}　对抗 DC ${c.dc}`;
      verdict.textContent = d === 20 ? "大成功！" : d === 1 ? "大失败……" : ok ? "成功" : "失败";
      verdict.className = "verdict " + (ok ? "ok" : "bad");
      rollBtn.textContent = "继续"; rollBtn.disabled = false; rollBtn.focus();
      if (!ok && c.who === "player" && state.player.inspiration > 0 && !reroll) { reBtn.hidden = false; reBtn.textContent = `消耗灵感重掷（剩 ${state.player.inspiration}）`; }
    };
    if (reduce) return show();
    d1.classList.add("spin"); d2 && d2.classList.add("spin"); d1.classList.remove("dim"); d2 && d2.classList.remove("dim");
    let n = 0; const t = setInterval(() => { d1.textContent = rollD20(); if (d2) d2.textContent = rollD20(); if (++n > 12) { clearInterval(t); show(); } }, 70);
  };
  rollBtn.onclick = () => { if (rolled) finishRoll(); else doRoll(false); };
  reBtn.onclick = () => { state.player.inspiration--; doRoll(true); };
}
function finishRoll() {
  const c = state.pendingCheck, x = rolled;
  $("modal").hidden = true;
  state.pendingCheck = null; rolled = null;
  const res = x.d === 20 ? "大成功" : x.d === 1 ? "大失败" : x.ok ? "成功" : "失败";
  const who = c.who === "player" ? "" : whoName(c.who) + " · ";
  push("roll", `${who}${x.label}　d20(${x.d}) ${sgn(x.bonus)} = ${x.total} / DC ${c.dc}　${res}`, { ok: x.ok });
  gm(`【检定结果】${whoName(c.who)}的${x.label}检定：d20 掷出 ${x.d}，加值 ${sgn(x.bonus)}，总计 ${x.total}，DC ${c.dc}，${res}。请叙述结果并继续。`, null);
}

/* =========================================================
   渲染：角色创建
   ========================================================= */
function renderCreate() {
  const d = draft, v = $("createView"); v.textContent = "";

function loadPortrait(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const W = 400, H = 600, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      const s = Math.max(W / im.width, H / im.height), w = im.width * s, h = im.height * s;
      cv.getContext("2d").drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
      draft.portraitData = cv.toDataURL("image/jpeg", 0.82);
      renderSummary();
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}
function startGame() {

  modal("序幕完", s => {
    s.classList.add("endcard");
    s.append(el("p", null, "晨光照进醉龙酒馆。你掌心的银色印记还在微微发烫。灰帆港的街道上，有人在找你们，也有人在等你们。"));
    const list = el("div", "step"); list.style.width = "100%";
    for (const id of Object.keys(COMPANIONS)) {
      const c = state.companions[id];
      const r = el("div", "kv"); r.append(el("span", null, PEOPLE[id].name + (c.recruited ? "（同行）" : c.taken ? "（被带走）" : "")), el("b", null, `${relLabel(c.approval)} ${sgn(c.approval)}`)); list.append(r);
    }
    const ht = el("div", "kv"); ht.append(el("span", null, "赫斯提雅的信任"), el("b", null, sgn(state.hestiaTrust))); list.append(ht);
    s.append(list);
    s.append(el("p", null, "第一幕《灰帆港》会在下一个版本开放。你的存档会保留，到时可以接着玩。"));
  });
}

$("mSheet").onclick = () => openSheet("player");
$("mJournal").onclick = openJournal;
$("mSave").onclick = () => openSaves(false);
$("mLoad").onclick = () => openSaves(true);
$("mSettings").onclick = openSettings;
$("stopBtn").onclick = () => ctl && ctl.abort();
$("retryBtn").onclick = () => {
  if (!lastAction) return;
  const { action, shown } = lastAction;
  if (shown) { const i = state.log.map(e => e.k === "you" && e.t === shown).lastIndexOf(true); if (i >= 0) state.log.splice(i, 1); }
  gm(action, shown);
};
$("freeForm").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("freeText").value.trim();
  if (!t || busy || state.pendingCheck) return;
  $("freeText").value = "";
  gm(t.slice(0, 500), t.slice(0, 500));
});
$("freeText").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("freeForm").requestSubmit(); } });

/* =========================================================
   启动
   ========================================================= */
function start(data) {
  draft = freshDraft();
  const auto = readSave(AUTO);
  state = data && data.state ? data.state : auto ? auto.state : null;
  if (data && data.draft) draft = data.draft;
  if (state) { state.log.forEach(e => delete e.live); state.log = state.log.filter(e => e.t || e.k === "chapter"); }
  render();
  if (state?.pendingCheck) openDice();
}
window.claude?.hot?.snapshot?.(() => ({ state, draft }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

(async () => {
  try { if (window.claude?.use) sample = await window.claude.use("sample"); } catch (e) { sample = null; }
  sampleKnown = true;
  if (!state || state.phase !== "play") renderSummary();
})();
</script>
